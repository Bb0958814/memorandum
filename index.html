<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StudyFlow · AI 讀書規劃系統</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Lora:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --sage: #7aab8e;
    --sage-light: #a8c9b5;
    --sage-pale: #e8f3ee;
    --mint: #c8e6d4;
    --sky: #b8d9e8;
    --sky-pale: #e4f1f8;
    --sand: #f5f0e8;
    --parchment: #faf8f4;
    --warm-white: #fffef9;
    --text-dark: #2d3a33;
    --text-mid: #5a6b61;
    --text-light: #8fa598;
    --accent-coral: #e8927a;
    --accent-yellow: #f0d080;
    --accent-blue: #78aec8;
    --border: #d5e8dd;
    --shadow: rgba(100, 150, 120, 0.12);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Noto Sans TC', sans-serif; background: var(--parchment); color: var(--text-dark); min-height: 100vh; overflow-x: hidden; }
  body::before { content: ''; position: fixed; inset: 0; background: radial-gradient(ellipse 80% 60% at 10% 20%, rgba(168,201,181,0.22) 0%, transparent 60%), radial-gradient(ellipse 60% 50% at 90% 80%, rgba(184,217,232,0.18) 0%, transparent 55%), radial-gradient(ellipse 40% 40% at 50% 50%, rgba(240,208,128,0.07) 0%, transparent 60%); pointer-events: none; z-index: 0; }

  .app-container { position: relative; z-index: 1; max-width: 1080px; margin: 0 auto; padding: 0 20px 60px; }
  nav { display: flex; align-items: center; justify-content: space-between; padding: 28px 0 20px; }
  .logo { display: flex; align-items: center; gap: 10px; }
  .logo-icon { width: 36px; height: 36px; background: var(--sage); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px; }
  .logo-text { font-family: 'Lora', serif; font-size: 20px; font-weight: 600; color: var(--text-dark); letter-spacing: 0.5px; }
  .logo-text span { color: var(--sage); }

  .nav-tabs { display: flex; gap: 4px; background: rgba(255,255,255,0.7); border: 1px solid var(--border); border-radius: 14px; padding: 5px; backdrop-filter: blur(8px); }
  .nav-tab { padding: 8px 18px; border-radius: 10px; font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.25s; color: var(--text-mid); border: none; background: transparent; font-family: inherit; }
  .nav-tab.active { background: var(--sage); color: white; box-shadow: 0 3px 10px rgba(122,171,142,0.35); }

  .panel { display: none; animation: fadeUp 0.4s ease; }
  .panel.active { display: block; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

  /* ===== CARDS ===== */
  .hero-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; margin-top: 28px; }
  .stat-card { background: rgba(255,255,255,0.75); border: 1px solid var(--border); border-radius: 20px; padding: 24px 22px; backdrop-filter: blur(10px); box-shadow: 0 4px 20px var(--shadow); }
  .stat-card.countdown { background: linear-gradient(135deg, var(--sage) 0%, #5a9070 100%); color: white; }
  .stat-card.countdown .label { color: rgba(255,255,255,0.8); }

  .section-title { font-family: 'Lora', serif; font-size: 18px; font-weight: 600; margin: 32px 0 14px; display: flex; align-items: center; gap: 10px; }
  .section-title::after { content: ''; flex: 1; height: 1px; background: linear-gradient(to right, var(--border), transparent); }

  /* ===== PROGRESS & COLOR PICKER ===== */
  .progress-block { background: rgba(255,255,255,0.75); border: 1px solid var(--border); border-radius: 20px; padding: 22px 24px; }
  .progress-bar { height: 8px; background: var(--sage-pale); border-radius: 10px; overflow: hidden; margin: 10px 0; }
  .progress-fill { height: 100%; background: var(--sage); transition: width 0.6s; }
  .subjects-row { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 15px; }
  .subject-chip { display: flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 30px; font-size: 12px; background: white; border: 1px solid var(--border); }
  .color-dot { width: 12px; height: 12px; border-radius: 50%; cursor: pointer; border: 1px solid rgba(0,0,0,0.1); position: relative; }
  .color-dot input[type="color"] { position: absolute; opacity: 0; width: 100%; height: 100%; cursor: pointer; }

  /* ===== TASK LISTS ===== */
  .task-item { display: flex; align-items: center; gap: 14px; background: rgba(255,255,255,0.75); border: 1px solid var(--border); border-radius: 14px; padding: 16px; margin-bottom: 8px; transition: 0.2s; }
  .task-item.done { opacity: 0.5; }
  .task-check { width: 20px; height: 20px; border-radius: 6px; border: 2px solid var(--sage-light); cursor: pointer; }
  .task-item.done .task-check { background: var(--sage); border-color: var(--sage); }

  /* ===== PLAN GRID ===== */
  .week-strip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; margin: 20px 0; }
  .week-day { background: white; border: 1px solid var(--border); border-radius: 14px; padding: 10px 5px; text-align: center; cursor: pointer; position: relative; }
  .week-day.selected { border: 2px solid var(--sage); background: var(--sage-pale); }
  .wd-progress-mini { position: absolute; bottom: 0; left: 0; height: 4px; background: var(--sage); border-radius: 0 0 14px 14px; transition: width 0.3s; }

  /* ===== ALERTS ===== */
  #procrastination-alert { display: none; }

  .btn-generate { width: 100%; background: var(--sage); color: white; border: none; border-radius: 12px; padding: 12px; cursor: pointer; font-weight: 600; margin-top: 10px; }
  .toast { position: fixed; bottom: 20px; right: 20px; background: #333; color: white; padding: 10px 20px; border-radius: 8px; opacity: 0; transition: 0.3s; z-index: 1000; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<div class="app-container">
  <nav>
    <div class="logo"><div class="logo-icon">🌿</div><span class="logo-text">Study<span>Flow</span></span></div>
    <div class="nav-tabs">
      <button class="nav-tab active" onclick="switchTab('home', this)">今日</button>
      <button class="nav-tab" onclick="switchTab('tasks', this)">任務</button>
      <button class="nav-tab" onclick="switchTab('plan', this)">計畫</button>
      <button class="nav-tab" onclick="switchTab('setup', this)">設定</button>
    </div>
  </nav>

  <div id="panel-home" class="panel active">
    <div class="hero-row">
      <div class="stat-card countdown">
        <div class="label" id="exam-label">距離考試</div>
        <div class="value" id="countdown-val">--</div>
        <div class="sub">Days Left</div>
      </div>
      <div class="stat-card">
        <div class="label">今日進度</div>
        <div class="value" id="today-pct">0%</div>
        <div class="sub">已完成任務</div>
      </div>
      <div class="stat-card">
        <div class="label">累積成就</div>
        <div class="value" id="total-done-stat">0</div>
        <div class="sub">項已結清任務</div>
      </div>
    </div>

    <div class="section-title">📅 今日任務</div>
    <div id="today-task-list">
      <p style="color:var(--text-light); font-size: 14px;">今天沒有排定任務，去任務區加一些吧！</p>
    </div>

    <div class="section-title">📊 各科進度</div>
    <div class="progress-block">
      <div style="display:flex; justify-content: space-between; font-size:14px;">
        <span>整體掌握度</span>
        <span id="global-progress-text">0%</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="global-progress-fill" style="width:0%"></div></div>
      <div class="subjects-row" id="subjects-container">
        </div>
    </div>
  </div>

  <div id="panel-tasks" class="panel">
    <div id="procrastination-alert" class="progress-block" style="background: #fff5f2; border-color: var(--accent-coral); margin-bottom: 20px;">
      <h4 style="color:var(--accent-coral)">⚠️ 偵測到拖延傾向</h4>
      <p style="font-size:13px">你有未完成的任務已自動移至今日。建議先從簡單的開始！</p>
    </div>

    <div class="progress-block" style="margin-bottom: 20px;">
      <div style="display:grid; grid-template-columns: 1fr auto auto auto; gap: 10px;">
        <input type="text" id="task-name" placeholder="想做什麼？" style="padding:10px; border:1px solid var(--border); border-radius:8px;">
        <select id="task-subject-select" style="padding:10px; border:1px solid var(--border); border-radius:8px;">
          <option value="一般">選擇科目</option>
          <option value="數學">數學</option>
          <option value="英文">英文</option>
          <option value="國文">國文</option>
          <option value="社會">社會</option>
          <option value="自然">自然</option>
        </select>
        <input type="date" id="task-date" style="padding:10px; border:1px solid var(--border); border-radius:8px;">
        <button onclick="addTask()" class="btn-generate" style="margin:0; width:auto; padding:0 20px;">新增</button>
      </div>
    </div>

    <div id="full-task-list"></div>
  </div>

  <div id="panel-plan" class="panel">
    <div class="week-strip" id="week-strip"></div>
    <div class="section-title" id="selected-date-title">選擇日期查看計畫</div>
    <div id="plan-day-tasks"></div>
  </div>

  <div id="panel-setup" class="panel">
    <div class="progress-block">
      <h3>⚙️ 系統設定</h3>
      <div style="margin-top:15px">
        <label style="display:block; font-size:12px; color:var(--text-light)">考試類型</label>
        <select id="exam-type" onchange="updateExamData()" style="width:100%; padding:10px; margin-bottom:15px; border-radius:8px; border:1px solid var(--border)">
          <option value="期末考試">期末考試</option>
          <option value="期中考試">期中考試</option>
          <option value="模擬考">模擬考</option>
          <option value="自訂目標">自訂目標</option>
        </select>
        
        <label style="display:block; font-size:12px; color:var(--text-light)">目標日期</label>
        <input type="date" id="exam-date-input" onchange="updateExamData()" style="width:100%; padding:10px; border-radius:8px; border:1px solid var(--border)">
      </div>
      <button class="btn-generate" onclick="switchTab('home', document.querySelectorAll('.nav-tab')[0])">儲存並返回今日</button>
    </div>
  </div>
</div>

<div id="toast" class="toast">已更新</div>

<script>
  // 核心數據結構
  let state = {
    tasks: JSON.parse(localStorage.getItem('studyflow_tasks')) || [],
    examDate: localStorage.getItem('studyflow_exam_date') || '2026-06-20',
    examName: localStorage.getItem('studyflow_exam_name') || '期末考試',
    subjectColors: JSON.parse(localStorage.getItem('studyflow_colors')) || {
      "數學": "#78aec8", "英文": "#e8927a", "國文": "#f0d080", "社會": "#7aab8e", "自然": "#a8c9b5", "一般": "#8fa598"
    }
  };

  const todayStr = new Date().toISOString().split('T')[0];

  // 初始化
  function init() {
    checkAutoForward(); // 自動延期邏輯
    renderAll();
    document.getElementById('exam-date-input').value = state.examDate;
    document.getElementById('exam-type').value = state.examName;
  }

  // 自動延期邏輯：未完成任務若日期早於今天，自動改為今天
  function checkAutoForward() {
    let changed = false;
    state.tasks.forEach(t => {
      if (!t.done && t.date < todayStr) {
        t.date = todayStr;
        changed = true;
      }
    });
    if (changed) {
      save();
      if (state.tasks.length > 0) {
        document.getElementById('procrastination-alert').style.display = 'block';
      }
    }
  }

  function save() {
    localStorage.setItem('studyflow_tasks', JSON.stringify(state.tasks));
    localStorage.setItem('studyflow_exam_date', state.examDate);
    localStorage.setItem('studyflow_exam_name', state.examName);
    localStorage.setItem('studyflow_colors', JSON.stringify(state.subjectColors));
  }

  function renderAll() {
    renderHome();
    renderTasks();
    renderWeekStrip();
    updateCountdown();
  }

  // --- 頁面切換 ---
  function switchTab(name, btn) {
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
    document.getElementById('panel-' + name).classList.add('active');
    btn.classList.add('active');
    renderAll();
  }

  // --- 任務管理 ---
  function addTask() {
    const name = document.getElementById('task-name').value;
    const date = document.getElementById('task-date').value || todayStr;
    const subject = document.getElementById('task-subject-select').value;
    if (!name) return;

    state.tasks.push({ id: Date.now(), name, date, subject, done: false });
    document.getElementById('task-name').value = '';
    save();
    renderAll();
    showToast("任務已連動至計畫區");
  }

  function toggleTask(id) {
    const task = state.tasks.find(t => t.id === id);
    if (task) task.done = !task.done;
    save();
    renderAll();
  }

  // --- 今日區渲染 ---
  function renderHome() {
    const todayList = document.getElementById('today-task-list');
    const tasksToday = state.tasks.filter(t => t.date === todayStr);
    
    if (tasksToday.length === 0) {
      todayList.innerHTML = `<p style="color:var(--text-light); font-size: 14px;">今天沒有排定任務。</p>`;
    } else {
      todayList.innerHTML = tasksToday.map(t => `
        <div class="task-item ${t.done ? 'done' : ''}" onclick="toggleTask(${t.id})">
          <div class="task-check"></div>
          <div style="flex:1">
            <div style="font-size:14px; font-weight:500">${t.name}</div>
            <div style="font-size:11px; color:${state.subjectColors[t.subject]}">● ${t.subject}</div>
          </div>
        </div>
      `).join('');
    }

    // 更新各科進度小標 (動態顯示)
    const container = document.getElementById('subjects-container');
    const activeSubjects = [...new Set(state.tasks.map(t => t.subject))];
    
    container.innerHTML = activeSubjects.map(sub => {
      const subTasks = state.tasks.filter(t => t.subject === sub);
      const done = subTasks.filter(t => t.done).length;
      const pct = Math.round((done / subTasks.length) * 100);
      const color = state.subjectColors[sub] || '#7aab8e';
      
      return `
        <div class="subject-chip">
          <div class="color-dot" style="background:${color}">
            <input type="color" value="${color}" onchange="updateSubColor('${sub}', this.value)">
          </div>
          ${sub} ${pct}%
        </div>
      `;
    }).join('');

    // 整體進度
    const totalDone = state.tasks.filter(t => t.done).length;
    const totalPct = state.tasks.length ? Math.round((totalDone / state.tasks.length) * 100) : 0;
    document.getElementById('global-progress-fill').style.width = totalPct + '%';
    document.getElementById('global-progress-text').textContent = totalPct + '%';
    document.getElementById('today-pct').textContent = totalPct + '%';
    document.getElementById('total-done-stat').textContent = totalDone;
  }

  function updateSubColor(sub, val) {
    state.subjectColors[sub] = val;
    save();
    renderAll();
  }

  // --- 任務區渲染 ---
  function renderTasks() {
    const container = document.getElementById('full-task-list');
    container.innerHTML = state.tasks.sort((a,b) => a.date > b.date ? 1 : -1).map(t => `
      <div class="task-item ${t.done ? 'done' : ''}">
        <div class="task-check" onclick="toggleTask(${t.id})"></div>
        <div style="flex:1">
          <div style="font-size:14px;">${t.name}</div>
          <div style="font-size:11px; color:var(--text-light)">${t.date} | ${t.subject}</div>
        </div>
        <button onclick="deleteTask(${t.id})" style="background:none; border:none; color:var(--text-light); cursor:pointer;">✕</button>
      </div>
    `).join('');
  }

  function deleteTask(id) {
    state.tasks = state.tasks.filter(t => t.id !== id);
    save();
    renderAll();
  }

  // --- 計畫區渲染 ---
  let viewDate = todayStr;
  function renderWeekStrip() {
    const strip = document.getElementById('week-strip');
    strip.innerHTML = '';
    
    for (let i = -3; i <= 3; i++) {
      let d = new Date();
      d.setDate(d.getDate() + i);
      let ds = d.toISOString().split('T')[0];
      
      const dayTasks = state.tasks.filter(t => t.date === ds);
      const doneTasks = dayTasks.filter(t => t.done).length;
      const pct = dayTasks.length ? (doneTasks / dayTasks.length) * 100 : 0;

      strip.innerHTML += `
        <div class="week-day ${ds === viewDate ? 'selected' : ''}" onclick="viewDayPlan('${ds}')">
          <div style="font-size:10px; color:var(--text-light)">${ds.split('-')[2]}</div>
          <div style="font-size:14px; font-weight:bold">${['日','一','二','三','四','五','六'][d.getDay()]}</div>
          <div class="wd-progress-mini" style="width:${pct}%"></div>
        </div>
      `;
    }
    viewDayPlan(viewDate);
  }

  function viewDayPlan(ds) {
    viewDate = ds;
    document.getElementById('selected-date-title').textContent = ds + (ds === todayStr ? " (今天)" : "") + " 計畫";
    const dayTasks = state.tasks.filter(t => t.date === ds);
    const container = document.getElementById('plan-day-tasks');
    
    if (dayTasks.length === 0) {
      container.innerHTML = `<p style="padding:20px; color:var(--text-light)">此日期尚無任務</p>`;
    } else {
      container.innerHTML = dayTasks.map(t => `
        <div class="task-item ${t.done ? 'done' : ''}" onclick="toggleTask(${t.id})">
          <div class="task-check"></div>
          <span>${t.name}</span>
        </div>
      `).join('');
    }
  }

  // --- 設定與倒數 ---
  function updateExamData() {
    state.examName = document.getElementById('exam-type').value;
    state.examDate = document.getElementById('exam-date-input').value;
    save();
    updateCountdown();
  }

  function updateCountdown() {
    const target = new Date(state.examDate);
    const now = new Date(todayStr);
    const diff = Math.ceil((target - now) / (1000 * 60 * 60 * 24));
    
    document.getElementById('exam-label').textContent = "距離" + state.examName;
    document.getElementById('countdown-val').textContent = diff >= 0 ? diff : "OVER";
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2000);
  }

  init();
</script>
</body>
</html>
