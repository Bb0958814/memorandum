<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StudyFlow · AI 讀書規劃系統</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Lora:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --sage: #7aab8e;
    --sage-light: #a8c9b5;
    --sage-pale: #e8f3ee;
    --mint: #c8e6d4;
    --sky: #b8d9e8;
    --sky-pale: #e4f1f8;
    --sand: #f5f0e8;
    --parchment: #faf8f4;
    --warm-white: #fffef9;
    --text-dark: #2d3a33;
    --text-mid: #5a6b61;
    --text-light: #8fa598;
    --accent-coral: #e8927a;
    --accent-yellow: #f0d080;
    --accent-blue: #78aec8;
    --border: #d5e8dd;
    --shadow: rgba(100, 150, 120, 0.12);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans TC', sans-serif;
    background: var(--parchment);
    color: var(--text-dark);
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 60% at 10% 20%, rgba(168,201,181,0.22) 0%, transparent 60%),
      radial-gradient(ellipse 60% 50% at 90% 80%, rgba(184,217,232,0.18) 0%, transparent 55%),
      radial-gradient(ellipse 40% 40% at 50% 50%, rgba(240,208,128,0.07) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  .leaf-deco { position: fixed; pointer-events: none; z-index: 0; opacity: 0.06; }
  .leaf-deco.tl { top: -40px; left: -40px; width: 280px; }
  .leaf-deco.br { bottom: -60px; right: -30px; width: 320px; transform: rotate(180deg); }

  .app-container { position: relative; z-index: 1; max-width: 1080px; margin: 0 auto; padding: 0 20px 60px; }

  nav { display: flex; align-items: center; justify-content: space-between; padding: 28px 0 20px; }
  .logo { display: flex; align-items: center; gap: 10px; }
  .logo-icon { width: 36px; height: 36px; background: var(--sage); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px; }
  .logo-text { font-family: 'Lora', serif; font-size: 20px; font-weight: 600; color: var(--text-dark); letter-spacing: 0.5px; }
  .logo-text span { color: var(--sage); }
  .nav-tabs { display: flex; gap: 4px; background: rgba(255,255,255,0.7); border: 1px solid var(--border); border-radius: 14px; padding: 5px; backdrop-filter: blur(8px); }
  .nav-tab { padding: 8px 18px; border-radius: 10px; font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.25s; color: var(--text-mid); border: none; background: transparent; font-family: inherit; }
  .nav-tab.active { background: var(--sage); color: white; box-shadow: 0 3px 10px rgba(122,171,142,0.35); }
  .nav-tab:not(.active):hover { background: var(--sage-pale); color: var(--sage); }

  .panel { display: none; animation: fadeUp 0.4s ease; }
  .panel.active { display: block; }

  @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

  /* ===== HOME ===== */
  .hero-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; margin-top: 28px; }
  .stat-card { background: rgba(255,255,255,0.75); border: 1px solid var(--border); border-radius: 20px; padding: 24px 22px; backdrop-filter: blur(10px); box-shadow: 0 4px 20px var(--shadow); transition: transform 0.2s, box-shadow 0.2s; }
  .stat-card:hover { transform: translateY(-3px); box-shadow: 0 8px 28px var(--shadow); }
  .stat-card .label { font-size: 12px; color: var(--text-light); letter-spacing: 0.8px; text-transform: uppercase; margin-bottom: 10px; }
  .stat-card .value { font-family: 'Lora', serif; font-size: 36px; font-weight: 600; color: var(--text-dark); }
  .stat-card .sub { font-size: 13px; color: var(--text-mid); margin-top: 6px; }
  .stat-card.countdown { background: linear-gradient(135deg, var(--sage) 0%, #5a9070 100%); border-color: transparent; }
  .stat-card.countdown .label, .stat-card.countdown .sub { color: rgba(255,255,255,0.75); }
  .stat-card.countdown .value { color: white; font-size: 48px; }

  .section-title { font-family: 'Lora', serif; font-size: 18px; font-weight: 600; color: var(--text-dark); margin: 32px 0 14px; display: flex; align-items: center; gap: 10px; }
  .section-title::after { content: ''; flex: 1; height: 1px; background: linear-gradient(to right, var(--border), transparent); }

  .task-list { display: flex; flex-direction: column; gap: 10px; }
  .task-item { display: flex; align-items: center; gap: 14px; background: rgba(255,255,255,0.75); border: 1px solid var(--border); border-radius: 14px; padding: 16px 18px; transition: all 0.25s; cursor: pointer; backdrop-filter: blur(8px); }
  .task-item:hover { background: rgba(255,255,255,0.95); transform: translateX(4px); box-shadow: 0 4px 16px var(--shadow); }
  .task-item.done { opacity: 0.55; }
  .task-item.done .task-name { text-decoration: line-through; color: var(--text-light); }
  .task-check { width: 22px; height: 22px; border-radius: 8px; border: 2px solid var(--sage-light); display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all 0.2s; background: transparent; }
  .task-item.done .task-check { background: var(--sage); border-color: var(--sage); }
  .task-check svg { display: none; }
  .task-item.done .task-check svg { display: block; }
  .task-name { flex: 1; font-size: 14px; font-weight: 500; }
  .task-sub { font-size: 12px; color: var(--text-light); }
  .tag { padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 500; letter-spacing: 0.3px; }
  .tag.high { background: rgba(232,146,122,0.15); color: #c0604a; }
  .tag.med { background: rgba(240,208,128,0.25); color: #9a7a20; }
  .tag.low { background: var(--sage-pale); color: var(--sage); }

  .progress-block { margin-top: 8px; background: rgba(255,255,255,0.75); border: 1px solid var(--border); border-radius: 20px; padding: 22px 24px; backdrop-filter: blur(8px); }
  .progress-label { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 13px; color: var(--text-mid); }
  .progress-bar { height: 8px; background: var(--sage-pale); border-radius: 10px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(to right, var(--sage), var(--accent-blue)); border-radius: 10px; transition: width 0.6s ease; }
  .subjects-row { display: flex; gap: 12px; margin-top: 16px; flex-wrap: wrap; }
  .subject-chip { display: flex; align-items: center; gap: 7px; padding: 7px 14px; border-radius: 30px; font-size: 12px; font-weight: 500; background: var(--sage-pale); color: var(--text-mid); border: 1px solid var(--border); }
  .subject-dot { width: 8px; height: 8px; border-radius: 50%; }

  /* ===== TASKS ===== */
  .add-task-bar { display: flex; gap: 10px; margin-top: 24px; background: rgba(255,255,255,0.8); border: 1px solid var(--border); border-radius: 16px; padding: 12px 16px; backdrop-filter: blur(8px); align-items: center; flex-wrap: wrap; }
  .add-task-bar input[type="text"] { flex: 1; min-width: 120px; border: none; background: transparent; font-family: inherit; font-size: 14px; color: var(--text-dark); outline: none; }
  .add-task-bar input::placeholder { color: var(--text-light); }
  .add-task-bar select { border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; font-family: inherit; font-size: 13px; color: var(--text-mid); background: white; outline: none; }
  .btn-add { background: var(--sage); color: white; border: none; border-radius: 10px; padding: 8px 16px; font-family: inherit; font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.2s; white-space: nowrap; }
  .btn-add:hover { background: #5a9070; transform: scale(1.02); }

  /* Exam date fields in task bar */
  .task-date-fields { display: flex; gap: 6px; align-items: center; }
  .task-date-fields select { padding: 6px 8px; font-size: 12px; min-width: 60px; }
  .task-date-label { font-size: 11px; color: var(--text-light); white-space: nowrap; }

  .filter-row { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  .filter-btn { padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border); background: rgba(255,255,255,0.7); font-family: inherit; font-size: 12px; color: var(--text-mid); cursor: pointer; transition: all 0.2s; }
  .filter-btn.active { background: var(--sage-pale); color: var(--sage); border-color: var(--sage-light); }

  .task-full { background: rgba(255,255,255,0.75); border: 1px solid var(--border); border-radius: 14px; padding: 16px 18px; display: flex; align-items: center; gap: 14px; transition: all 0.25s; backdrop-filter: blur(8px); margin-bottom: 10px; }
  .task-full:hover { background: rgba(255,255,255,0.95); box-shadow: 0 4px 16px var(--shadow); }
  .task-full.done { opacity: 0.5; }
  .task-full.done .task-name { text-decoration: line-through; }
  .task-full .check-box { width: 22px; height: 22px; border-radius: 8px; border: 2px solid var(--sage-light); cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all 0.2s; }
  .task-full.done .check-box { background: var(--sage); border-color: var(--sage); }
  .task-meta { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-top: 4px; }
  .delete-btn { margin-left: auto; background: none; border: none; cursor: pointer; color: var(--text-light); font-size: 16px; opacity: 0; transition: opacity 0.2s; padding: 4px; }
  .task-full:hover .delete-btn { opacity: 1; }
  .deadline-info { font-size: 11px; color: var(--text-light); }

  .alert-box { background: linear-gradient(135deg, rgba(232,146,122,0.12), rgba(240,208,128,0.10)); border: 1px solid rgba(232,146,122,0.3); border-radius: 16px; padding: 16px 20px; display: flex; gap: 14px; align-items: flex-start; margin-bottom: 16px; }
  .alert-icon { font-size: 20px; flex-shrink: 0; margin-top: 2px; }
  .alert-text h4 { font-size: 14px; font-weight: 600; color: #c0604a; margin-bottom: 4px; }
  .alert-text p { font-size: 13px; color: var(--text-mid); }

  /* ===== PLAN ===== */
  .date-nav { display: flex; align-items: center; gap: 16px; margin-top: 24px; margin-bottom: 20px; flex-wrap: wrap; }
  .date-nav-btn { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--border); background: rgba(255,255,255,0.8); cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
  .date-nav-btn:hover { background: var(--sage-pale); border-color: var(--sage-light); }
  .date-display { font-family: 'Lora', serif; font-size: 22px; font-weight: 600; color: var(--text-dark); cursor: pointer; display: flex; align-items: center; gap: 8px; }
  .date-display span { font-size: 14px; font-weight: 400; color: var(--text-light); }
  .date-display:hover { color: var(--sage); }

  /* Date picker popup */
  .date-picker-popup { display: none; position: absolute; z-index: 100; background: white; border: 1px solid var(--border); border-radius: 16px; padding: 16px; box-shadow: 0 8px 30px rgba(0,0,0,0.12); margin-top: 8px; }
  .date-picker-popup.show { display: block; }
  .date-picker-row { display: flex; gap: 8px; align-items: center; }
  .date-picker-row select { border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-family: inherit; font-size: 14px; color: var(--text-dark); background: var(--sage-pale); outline: none; cursor: pointer; }
  .date-picker-row select:focus { border-color: var(--sage); }
  .btn-confirm-date { background: var(--sage); color: white; border: none; border-radius: 8px; padding: 8px 16px; font-family: inherit; font-size: 13px; font-weight: 500; cursor: pointer; white-space: nowrap; }
  .btn-confirm-date:hover { background: #5a9070; }

  .week-strip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; margin-bottom: 24px; }
  .week-day { background: rgba(255,255,255,0.6); border: 1px solid var(--border); border-radius: 14px; padding: 12px 8px; text-align: center; cursor: pointer; transition: all 0.2s; }
  .week-day:hover { background: var(--sage-pale); border-color: var(--sage-light); }
  .week-day.selected { background: var(--sage); border-color: var(--sage); }
  .week-day.selected .wd-day, .week-day.selected .wd-date { color: white; }
  .wd-day { font-size: 11px; color: var(--text-light); margin-bottom: 4px; }
  .wd-date { font-size: 15px; font-weight: 600; color: var(--text-dark); }
  .wd-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--sage-light); margin: 5px auto 0; }
  .week-day.selected .wd-dot { background: rgba(255,255,255,0.6); }
  .week-day.has-tasks .wd-dot { background: var(--accent-coral); }

  .plan-subject { background: rgba(255,255,255,0.75); border: 1px solid var(--border); border-radius: 18px; padding: 20px 24px; margin-bottom: 12px; backdrop-filter: blur(8px); border-left: 4px solid var(--sage); transition: all 0.2s; }
  .plan-subject:hover { box-shadow: 0 4px 20px var(--shadow); transform: translateX(3px); }
  .plan-subject.math { border-left-color: var(--accent-blue); }
  .plan-subject.english { border-left-color: var(--accent-coral); }
  .plan-subject.history { border-left-color: var(--accent-yellow); }
  .plan-subject.science { border-left-color: var(--sage); }
  .plan-subj-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .plan-subj-name { font-size: 15px; font-weight: 600; }
  .plan-time { font-size: 12px; color: var(--text-light); }
  .plan-tasks { display: flex; flex-direction: column; gap: 7px; }
  .plan-task-item { font-size: 13px; color: var(--text-mid); display: flex; gap: 8px; align-items: center; cursor: pointer; transition: color 0.2s; }
  .plan-task-item::before { content: '›'; color: var(--sage); font-size: 16px; }
  .plan-task-item.completed { text-decoration: line-through; opacity: 0.5; }
  .plan-task-item.completed::before { content: '✓'; color: var(--sage); font-size: 12px; }

  /* ===== SETUP ===== */
  .setup-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 24px; }
  .setup-card { background: rgba(255,255,255,0.75); border: 1px solid var(--border); border-radius: 20px; padding: 24px; backdrop-filter: blur(10px); box-shadow: 0 4px 20px var(--shadow); }
  .setup-card h3 { font-size: 16px; font-weight: 600; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
  .form-field { margin-bottom: 14px; }
  .form-field label { display: block; font-size: 12px; color: var(--text-light); margin-bottom: 5px; letter-spacing: 0.5px; text-transform: uppercase; }
  .form-field input, .form-field select { width: 100%; padding: 10px 14px; border: 1px solid var(--border); border-radius: 10px; font-family: inherit; font-size: 14px; color: var(--text-dark); background: rgba(255,255,255,0.8); outline: none; transition: border-color 0.2s; }
  .form-field input:focus, .form-field select:focus { border-color: var(--sage); }

  /* Date picker in setup — year/month/day selects */
  .date-selects { display: flex; gap: 6px; }
  .date-selects select { flex: 1; padding: 10px 8px; border: 1px solid var(--border); border-radius: 10px; font-family: inherit; font-size: 13px; color: var(--text-dark); background: rgba(255,255,255,0.8); outline: none; }
  .date-selects select:focus { border-color: var(--sage); }

  .btn-generate { width: 100%; background: linear-gradient(135deg, var(--sage), #5a9070); color: white; border: none; border-radius: 12px; padding: 13px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.25s; letter-spacing: 0.5px; margin-top: 4px; }
  .btn-generate:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(122,171,142,0.4); }
  .ai-badge { display: inline-flex; align-items: center; gap: 5px; background: linear-gradient(135deg, rgba(122,171,142,0.15), rgba(120,174,200,0.15)); border: 1px solid var(--sage-light); border-radius: 20px; padding: 4px 12px; font-size: 11px; color: var(--sage); font-weight: 600; letter-spacing: 0.5px; }

  /* Analytics */
  .analytics-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 20px; }
  .analytics-card { background: rgba(255,255,255,0.75); border: 1px solid var(--border); border-radius: 18px; padding: 20px; backdrop-filter: blur(8px); }
  .analytics-card h4 { font-size: 13px; color: var(--text-light); margin-bottom: 16px; letter-spacing: 0.5px; text-transform: uppercase; }
  .mini-bars { display: flex; flex-direction: column; gap: 8px; }
  .mini-bar-row { display: flex; align-items: center; gap: 10px; font-size: 12px; }
  .mini-bar-row .name { width: 36px; color: var(--text-mid); }
  .mini-bar-track { flex: 1; height: 6px; background: var(--sage-pale); border-radius: 3px; overflow: hidden; }
  .mini-bar-fill { height: 100%; border-radius: 3px; transition: width 0.8s ease; }
  .mini-bar-val { font-size: 11px; color: var(--text-light); width: 28px; text-align: right; }

  .daily-progress-wrap{
    margin-top:10px;
  }
  .daily-progress-label{
    font-size:11px;
    color:var(--text-light);
    margin-bottom:4px;
  }
  .daily-progress-bar{
    width:100%;
    height:6px;
    background:var(--sage-pale);
    border-radius:10px;
    overflow:hidden;
  }
  .daily-progress-fill{
    height:100%;
    background:linear-gradient(to right,var(--sage),var(--accent-blue));
    border-radius:10px;
    transition:width .4s ease;
  }


  /* Toast */
  .toast { position: fixed; bottom: 28px; right: 28px; background: var(--text-dark); color: white; padding: 12px 20px; border-radius: 12px; font-size: 13px; transform: translateY(80px); opacity: 0; transition: all 0.3s; z-index: 1000; pointer-events: none; }
  .toast.show { transform: translateY(0); opacity: 1; }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--sage-light); border-radius: 3px; }

  @media (max-width: 700px) {
    .hero-row { grid-template-columns: 1fr 1fr; }
    .hero-row .stat-card:last-child { grid-column: span 2; }
    .setup-grid { grid-template-columns: 1fr; }
    .analytics-grid { grid-template-columns: 1fr; }
    .week-strip { gap: 4px; }
    nav { flex-direction: column; gap: 14px; }
    .date-selects { flex-wrap: wrap; }
  }
</style>
</head>
<body>

<svg class="leaf-deco tl" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <path d="M20 180 Q60 20 180 30 Q100 100 20 180Z" fill="#7aab8e"/>
  <path d="M20 180 Q80 80 180 30" stroke="#5a9070" stroke-width="2" fill="none"/>
</svg>
<svg class="leaf-deco br" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <path d="M20 180 Q60 20 180 30 Q100 100 20 180Z" fill="#78aec8"/>
  <path d="M20 180 Q80 80 180 30" stroke="#5a90a8" stroke-width="2" fill="none"/>
</svg>

<div class="app-container">
  <nav>
    <div class="logo">
      <div class="logo-icon">🌿</div>
      <span class="logo-text">Study<span>Flow</span></span>
    </div>
    <div class="nav-tabs">
      <button class="nav-tab active" onclick="switchTab('home', this)">今日</button>
      <button class="nav-tab" onclick="switchTab('tasks', this)">任務</button>
      <button class="nav-tab" onclick="switchTab('plan', this)">計畫</button>
      <button class="nav-tab" onclick="switchTab('setup', this)">設定</button>
    </div>
  </nav>

  <!-- ===== HOME ===== -->
  <div id="panel-home" class="panel active">
    <div class="hero-row">
      <div class="stat-card countdown">
        <div class="label">距離考試</div>
        <div class="value" id="countdown-val">--</div>
        <div class="sub" id="countdown-sub">請設定考試日期</div>
      </div>
      <div class="stat-card">
        <div class="label">今日完成</div>
        <div class="value"><span id="done-count">0</span><span style="font-size:18px;color:var(--text-light)" id="total-count">/0</span></div>
        <div class="sub">項任務</div>
      </div>
      <div class="stat-card">
        <div class="label">本週完成率</div>
        <div class="value" style="color:var(--sage)"><span id="weekly-pct">0</span><span style="font-size:18px">%</span></div>
        <div class="sub" id="weekly-sub">尚未開始</div>
      </div>
    </div>

    <div class="section-title">📋 今日任務</div>
    <div class="task-list" id="home-tasks"></div>

    <div class="section-title">📊 各科進度</div>
    <div class="progress-block">
      <div class="progress-label"><span>整體學習進度</span><span id="prog-pct">0%</span></div>
      <div class="progress-bar"><div class="progress-fill" id="prog-fill" style="width:0%"></div></div>
      <div class="subjects-row">
        <div class="subject-chip"><div class="subject-dot" style="background:#78aec8"></div>數學 0%</div>
        <div class="subject-chip"><div class="subject-dot" style="background:#e8927a"></div>英文 0%</div>
        <div class="subject-chip"><div class="subject-dot" style="background:#f0d080"></div>歷史 0%</div>
        <div class="subject-chip"><div class="subject-dot" style="background:#7aab8e"></div>理化 0%</div>
      </div>
    </div>
  </div>

  <!-- ===== TASKS ===== -->
  <div id="panel-tasks" class="panel">
    <div class="alert-box">
      <div class="alert-icon">⚠️</div>
      <div class="alert-text">
        <h4 id="drag-alert-title">尚未偵測到拖延傾向</h4>
        <p id="drag-alert-text">完成任務後，AI 會根據你的目標完成度分析拖延傾向與拖延預測。</p>
      </div>
    </div>

    <div class="add-task-bar">
      <span style="font-size:18px">✏️</span>
      <input type="text" id="task-input" placeholder="新增任務...按 Enter 送出" onkeydown="addTask(event)">
      <select id="task-type">
        <option>讀書</option>
        <option>考試</option>
        <option>作業</option>
        <option>生活</option>
      </select>
      <select id="task-priority">
        <option value="high">重要</option>
        <option value="med" selected>一般</option>
        <option value="low">輕鬆</option>
      </select>
      <div style="display:flex;align-items:center;gap:4px;flex-shrink:0">
        <span class="task-date-label">截止：</span>
        <div class="task-date-fields">
          <select id="deadline-year"></select>
          <select id="deadline-month"></select>
          <select id="deadline-day"></select>
        </div>
      </div>
      <button class="btn-add" onclick="addTaskBtn()">＋ 新增</button>
    </div>

    <div class="filter-row">
      <button class="filter-btn active" onclick="filterTasks(this,'all')">全部</button>
      <button class="filter-btn" onclick="filterTasks(this,'active')">未完成</button>
      <button class="filter-btn" onclick="filterTasks(this,'done')">已完成</button>
      <button class="filter-btn" onclick="filterTasks(this,'high')">⚡ 重要</button>
      <button class="filter-btn" onclick="filterTasks(this,'exam')">📝 考試</button>
    </div>

    <div class="task-list" id="full-task-list" style="margin-top:16px"></div>
  </div>

  <!-- ===== PLAN ===== -->
  <div id="panel-plan" class="panel">
    <div class="date-nav" style="position:relative">
      <button class="date-nav-btn" onclick="changeDate(-1)">‹</button>
      <div style="position:relative">
        <div class="date-display" id="plan-date-display" onclick="toggleDatePicker()" title="點擊選擇日期">
          5月 03日 <span>今天</span> <span style="font-size:14px;color:var(--sage)">▾</span>
        </div>
        <div class="date-picker-popup" id="date-picker-popup">
          <div class="date-picker-row">
            <select id="pick-year"></select>
            <span style="color:var(--text-light);font-size:13px">年</span>
            <select id="pick-month"></select>
            <span style="color:var(--text-light);font-size:13px">月</span>
            <select id="pick-day"></select>
            <span style="color:var(--text-light);font-size:13px">日</span>
            <button class="btn-confirm-date" onclick="confirmDatePicker()">確認</button>
          </div>
        </div>
      </div>
      <button class="date-nav-btn" onclick="changeDate(1)">›</button>
      <div style="margin-left:auto"><span class="ai-badge" style="cursor:pointer" onclick="jumpToGenerate()">✦ AI 自動排程</span></div>
    </div>

    <div class="week-strip" id="week-strip"></div>

    
<div id="plan-content">
      <div class="plan-subject">
        <div class="plan-subj-header">
          <div class="plan-subj-name">🗓️ 尚未建立讀書計畫</div>
        </div>
        <div class="plan-tasks">
          <div class="plan-task-item">請到「設定」頁面建立你的 AI 讀書計畫</div>
        </div>
      </div>
    </div>
  </div>

  <!-- ===== SETUP ===== -->
  <div id="panel-setup" class="panel">
    <div class="setup-grid">
      <div class="setup-card">
        <h3>📅 考試設定 <span class="ai-badge">✦ AI</span></h3>
        <div class="form-field">
          <label>考試名稱</label>
          <input type="text" placeholder="例：期末考試" id="exam-name" value="期末考試">
        </div>
        <div class="form-field">
          <label>考試日期（年 / 月 / 日）</label>
          <div class="date-selects">
            <select id="exam-year"></select>
            <select id="exam-month"></select>
            <select id="exam-day"></select>
          </div>
        </div>
        <div class="form-field">
          <label>每天可讀書時間（小時）</label>
          <input type="number" min="1" max="12" value="4" id="daily-hours">
        </div>
        <div class="form-field">
          <label>科目（逗號分隔）</label>
          <input type="text" placeholder="數學, 英文, 歷史" id="subjects-input" value="數學, 英文, 歷史, 理化">
        </div>
        <button class="btn-generate" onclick="generatePlan()">✦ AI 自動生成讀書計畫</button>
      </div>

      <div class="setup-card">
        <h3>🔔 提醒設定</h3>
        <div class="form-field">
          <label>每日提醒時間</label>
          <input type="time" value="08:30" id="reminder-time">
        </div>
        <div class="form-field">
          <label>拖延偵測靈敏度</label>
          <select id="procrastination-sensitivity">
            <option>一般（2天）</option>
            <option>敏感（1天）</option>
            <option>寬鬆（3天）</option>
          </select>
        </div>
        <div class="form-field">
          <label>壓力過高警示（任務數）</label>
          <input type="number" min="3" max="20" value="8" id="stress-threshold">
        </div>
        <button class="btn-generate" style="background:linear-gradient(135deg,var(--accent-blue),#5a8aab)" onclick="saveSettings()">💾 儲存設定</button>
      </div>
    </div>

    <div class="section-title">📈 學習效率分析</div>
    <div class="analytics-grid">
      <div class="analytics-card">
        <h4>各科進度</h4>
        <div class="mini-bars" id="subject-bars">
          <div class="mini-bar-row">
            <span class="name">數學</span>
            <div class="mini-bar-track"><div class="mini-bar-fill" style="width:45%;background:#78aec8"></div></div>
            <span class="mini-bar-val">45%</span>
          </div>
          <div class="mini-bar-row">
            <span class="name">英文</span>
            <div class="mini-bar-track"><div class="mini-bar-fill" style="width:72%;background:#e8927a"></div></div>
            <span class="mini-bar-val">72%</span>
          </div>
          <div class="mini-bar-row">
            <span class="name">歷史</span>
            <div class="mini-bar-track"><div class="mini-bar-fill" style="width:60%;background:#f0d080"></div></div>
            <span class="mini-bar-val">60%</span>
          </div>
          <div class="mini-bar-row">
            <span class="name">理化</span>
            <div class="mini-bar-track"><div class="mini-bar-fill" style="width:55%;background:#7aab8e"></div></div>
            <span class="mini-bar-val">55%</span>
          </div>
        </div>
      </div>
      <div class="analytics-card">
        <h4>本週完成率（週一 ～ 週日）</h4>
        <div class="mini-bars" id="weekly-bars">
          <!-- Rendered by JS -->
        </div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  // ===== GLOBAL STATE =====
  const today = new Date();
  let planOffset = 0; // offset in days from today
  let selectedPlanDate = new Date(today);
  const weekDayNames = ['日','一','二','三','四','五','六'];

  // Weekly completion data (Mon–Sun), stored as percentages
  // We track which days in current week have tasks done
  let weeklyData = [0, 0, 0, 0, 0, 0, 0]; // Mon=0 ... Sun=6

  // ===== TAB SWITCHING =====
  function switchTab(name, btn) {
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
    document.getElementById('panel-' + name).classList.add('active');
    btn.classList.add('active');
  }

  // ===== HOME TASKS =====
  function toggleHome(el) {
    el.classList.toggle('done');
    updateDoneCount(); analyzeProcrastination(); updateSubjectProgress();
    updateWeeklyBars();
  }

  function updateDoneCount() {
    const items = document.querySelectorAll('#home-tasks .task-item');
    const done = document.querySelectorAll('#home-tasks .task-item.done');
    document.getElementById('done-count').textContent = done.length;
    document.getElementById('total-count').textContent = '/' + items.length;
    const pct = items.length ? Math.round((done.length / items.length) * 100) : 0;
    document.getElementById('prog-fill').style.width = pct + '%';
    document.getElementById('prog-pct').textContent = pct + '%';
    // Update today's weekly slot
    const dayOfWeek = today.getDay(); // 0=Sun...6=Sat
    const idx = dayOfWeek === 0 ? 6 : dayOfWeek - 1; // Mon=0
    weeklyData[idx] = pct;
    updateWeeklyBars();
  }

  // ===== TASKS MANAGEMENT =====
  let tasks = [];
  let taskFilter = 'all';

  function formatDeadlineStr(d) {
    if (!d) return null;
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }

  function deadlineLabel(dl) {
    if (!dl) return '';
    const d = new Date(dl);
    const diff = Math.round((d - new Date(today.toDateString())) / 86400000);
    if (diff < 0) return `<span style="color:#c0604a;font-size:11px">⚠ 已過期</span>`;
    if (diff === 0) return `<span style="color:#c0604a;font-size:11px">📌 今天到期</span>`;
    if (diff === 1) return `<span style="color:#e8927a;font-size:11px">明天到期</span>`;
    return `<span style="font-size:11px;color:var(--text-light)">${d.getMonth()+1}/${d.getDate()} 到期</span>`;
  }

  function renderTasks() {
    const list = document.getElementById('full-task-list');
    let filtered = [...tasks];
    if (taskFilter === 'active') filtered = tasks.filter(t => !t.done);
    else if (taskFilter === 'done') filtered = tasks.filter(t => t.done);
    else if (taskFilter === 'high') filtered = tasks.filter(t => t.priority === 'high');
    else if (taskFilter === 'exam') filtered = tasks.filter(t => t.type === '考試');

    filtered.sort((a, b) => {
      if (a.done !== b.done) return a.done ? 1 : -1;
      const pri = { high: 0, med: 1, low: 2 };
      return pri[a.priority] - pri[b.priority];
    });

    const typeIcons = { '讀書': '📚', '考試': '📝', '作業': '📋', '生活': '🏠' };

    list.innerHTML = filtered.map(t => `
      <div class="task-full ${t.done ? 'done' : ''}" id="task-${t.id}">
        <div class="check-box" onclick="toggleTask(${t.id})">
          ${t.done ? '<svg width="12" height="9" viewBox="0 0 12 9" fill="none"><path d="M1 4L4.5 7.5L11 1" stroke="white" stroke-width="2" stroke-linecap="round"/></svg>' : ''}
        </div>
        <div style="flex:1">
          <div class="task-name">${t.name}</div>
          <div class="task-meta">
            <span class="tag ${t.priority}">${t.priority === 'high' ? '重要' : t.priority === 'med' ? '一般' : '輕鬆'}</span>
            <span style="font-size:11px;color:var(--text-light)">${typeIcons[t.type] || ''} ${t.type}</span>
            ${t.deadline ? deadlineLabel(t.deadline) : ''}
          </div>
        </div>
        <button class="delete-btn" onclick="deleteTask(${t.id})">✕</button>
      </div>
    `).join('');
  }

  function toggleTask(id) {
    tasks = tasks.map(t => t.id === id ? { ...t, done: !t.done } : t);
    renderTasks();
    showToast('任務狀態已更新 ✓'); analyzeProcrastination(); updateSubjectProgress();
  }

  function deleteTask(id) {
    tasks = tasks.filter(t => t.id !== id);
    renderTasks();
    showToast('任務已刪除'); analyzeProcrastination(); updateSubjectProgress();
  }

  function filterTasks(btn, f) {
    taskFilter = f;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderTasks();
  }

  function addTask(e) { if (e.key === 'Enter') addTaskBtn(); }

  function addTaskBtn() {
    const input = document.getElementById('task-input');
    const type = document.getElementById('task-type').value;
    const priority = document.getElementById('task-priority').value;
    const y = document.getElementById('deadline-year').value;
    const m = document.getElementById('deadline-month').value;
    const d = document.getElementById('deadline-day').value;
    if (!input.value.trim()) return;
    const deadline = (y && m && d) ? `${y}-${m.padStart(2,'0')}-${d.padStart(2,'0')}` : null;
    tasks.unshift({ id: Date.now(), name: input.value.trim(), type, priority, done: false, deadline });
    input.value = '';
    renderTasks();
    showToast('任務已新增！'); analyzeProcrastination(); updateSubjectProgress();
  }

  // ===== PLAN WEEK STRIP =====
  function renderWeekStrip() {
    const strip = document.getElementById('week-strip');
    strip.innerHTML = '';
    for (let i = -3; i <= 3; i++) {
      const d = new Date(today);
      d.setDate(today.getDate() + planOffset + i);
      const isSelected = i === 0;
      const hasTasks = [0,1,2,5].includes(((planOffset + i) % 7 + 7) % 7);
      strip.innerHTML += `
        <div class="week-day ${isSelected ? 'selected' : ''} ${hasTasks ? 'has-tasks' : ''}" onclick="selectDayFromStrip(${i})">
          <div class="wd-day">週${weekDayNames[d.getDay()]}</div>
          <div class="wd-date">${d.getDate()}</div>
          <div class="wd-dot"></div>
        </div>`;
    }
    const cur = new Date(today);
    cur.setDate(today.getDate() + planOffset);
    const isToday = planOffset === 0;
    document.getElementById('plan-date-display').innerHTML =
      `${cur.getFullYear()}年${cur.getMonth()+1}月${String(cur.getDate()).padStart(2,'0')}日 ${isToday ? '<span>今天</span>' : '<span>週' + weekDayNames[cur.getDay()] + '</span>'} <span style="font-size:14px;color:var(--sage)">▾</span>`;
    // Sync date picker selects
    document.getElementById('pick-year').value = cur.getFullYear();
    document.getElementById('pick-month').value = cur.getMonth() + 1;
    updatePickerDays(cur.getFullYear(), cur.getMonth() + 1, cur.getDate());
  }

  function changeDate(dir) {
    planOffset += dir;
    renderWeekStrip();
  }

  function selectDayFromStrip(offset) {
    planOffset += offset;
    renderWeekStrip();
  }

  // ===== DATE PICKER (PLAN) =====
  function toggleDatePicker() {
    const popup = document.getElementById('date-picker-popup');
    popup.classList.toggle('show');
  }

  function confirmDatePicker() {
    const y = parseInt(document.getElementById('pick-year').value);
    const m = parseInt(document.getElementById('pick-month').value);
    const d = parseInt(document.getElementById('pick-day').value);
    const picked = new Date(y, m - 1, d);
    planOffset = Math.round((picked - new Date(today.toDateString())) / 86400000);
    document.getElementById('date-picker-popup').classList.remove('show');
    renderWeekStrip();
    showToast(`已跳轉至 ${y}年${m}月${d}日`);
  }

  document.addEventListener('click', function(e) {
    const popup = document.getElementById('date-picker-popup');
    const display = document.getElementById('plan-date-display');
    if (!popup.contains(e.target) && !display.contains(e.target)) {
      popup.classList.remove('show');
    }
  });

  function updatePickerDays(y, m, selectedDay) {
    const daysSel = document.getElementById('pick-day');
    const daysInMonth = new Date(y, m, 0).getDate();
    daysSel.innerHTML = '';
    for (let i = 1; i <= daysInMonth; i++) {
      const opt = document.createElement('option');
      opt.value = i;
      opt.textContent = i;
      if (i === selectedDay) opt.selected = true;
      daysSel.appendChild(opt);
    }
  }

  function initPickerSelects() {
    const yearSel = document.getElementById('pick-year');
    const monthSel = document.getElementById('pick-month');
    const curY = today.getFullYear();
    for (let y = curY - 1; y <= curY + 2; y++) {
      const opt = document.createElement('option');
      opt.value = y; opt.textContent = y + '年';
      if (y === curY) opt.selected = true;
      yearSel.appendChild(opt);
    }
    for (let m = 1; m <= 12; m++) {
      const opt = document.createElement('option');
      opt.value = m; opt.textContent = m + '月';
      if (m === today.getMonth() + 1) opt.selected = true;
      monthSel.appendChild(opt);
    }
    updatePickerDays(curY, today.getMonth() + 1, today.getDate());

    yearSel.addEventListener('change', () => {
      updatePickerDays(parseInt(yearSel.value), parseInt(monthSel.value), parseInt(document.getElementById('pick-day').value) || 1);
    });
    monthSel.addEventListener('change', () => {
      updatePickerDays(parseInt(yearSel.value), parseInt(monthSel.value), parseInt(document.getElementById('pick-day').value) || 1);
    });
  }

  // ===== PLAN TASK TOGGLE =====
  function togglePlanTask(el) {
    el.classList.toggle('completed');
    showToast(el.classList.contains('completed') ? '計畫項目完成 ✓' : '計畫項目已取消');
  }

  // ===== SETUP — EXAM DATE SELECTS =====
  function initExamDateSelects() {
    const examY = document.getElementById('exam-year');
    const examM = document.getElementById('exam-month');
    const examD = document.getElementById('exam-day');
    const defaultDate = new Date(today);
    defaultDate.setDate(defaultDate.getDate() + 23);

    const curY = today.getFullYear();
    for (let y = curY; y <= curY + 3; y++) {
      const opt = document.createElement('option');
      opt.value = y; opt.textContent = y + '年';
      if (y === defaultDate.getFullYear()) opt.selected = true;
      examY.appendChild(opt);
    }
    for (let m = 1; m <= 12; m++) {
      const opt = document.createElement('option');
      opt.value = m; opt.textContent = m + '月';
      if (m === defaultDate.getMonth() + 1) opt.selected = true;
      examM.appendChild(opt);
    }
    const fillExamDays = (y, m, sel) => {
      const days = new Date(y, m, 0).getDate();
      examD.innerHTML = '';
      for (let d = 1; d <= days; d++) {
        const opt = document.createElement('option');
        opt.value = d; opt.textContent = d + '日';
        if (d === sel) opt.selected = true;
        examD.appendChild(opt);
      }
    };
    fillExamDays(defaultDate.getFullYear(), defaultDate.getMonth() + 1, defaultDate.getDate());
    examY.addEventListener('change', () => fillExamDays(parseInt(examY.value), parseInt(examM.value), 1));
    examM.addEventListener('change', () => fillExamDays(parseInt(examY.value), parseInt(examM.value), 1));
    updateCountdown();
    examY.addEventListener('change', updateCountdown);
    examM.addEventListener('change', updateCountdown);
    examD.addEventListener('change', updateCountdown);
  }

  function updateCountdown() {
    const y = parseInt(document.getElementById('exam-year').value);
    const m = parseInt(document.getElementById('exam-month').value);
    const d = parseInt(document.getElementById('exam-day').value);
    const examDate = new Date(y, m - 1, d);
    const diff = Math.round((examDate - new Date(today.toDateString())) / 86400000);
    document.getElementById('countdown-val').textContent = diff > 0 ? diff : 0;
    const name = document.getElementById('exam-name').value || '考試';
    document.getElementById('countdown-sub').textContent = diff > 0 ? `天 · 距${name}` : '請設定考試日期';
  }

  // ===== SETUP — TASK DEADLINE SELECTS =====
  function initDeadlineSelects() {
    const y = document.getElementById('deadline-year');
    const m = document.getElementById('deadline-month');
    const d = document.getElementById('deadline-day');

    const yOpt = document.createElement('option');
    yOpt.value = ''; yOpt.textContent = '年'; y.appendChild(yOpt);
    const curY = today.getFullYear();
    for (let yr = curY; yr <= curY + 2; yr++) {
      const opt = document.createElement('option'); opt.value = yr; opt.textContent = yr; y.appendChild(opt);
    }

    const mOpt = document.createElement('option');
    mOpt.value = ''; mOpt.textContent = '月'; m.appendChild(mOpt);
    for (let mo = 1; mo <= 12; mo++) {
      const opt = document.createElement('option'); opt.value = String(mo).padStart(2,'0'); opt.textContent = mo + '月'; m.appendChild(opt);
    }

    const fillDays = () => {
      const curD = d.value;
      const dOpt = document.createElement('option');
      d.innerHTML = ''; dOpt.value = ''; dOpt.textContent = '日'; d.appendChild(dOpt);
      const yv = parseInt(y.value) || curY;
      const mv = parseInt(m.value) || 1;
      const days = new Date(yv, mv, 0).getDate();
      for (let di = 1; di <= days; di++) {
        const opt = document.createElement('option'); opt.value = di; opt.textContent = di + '日';
        if (di === parseInt(curD)) opt.selected = true;
        d.appendChild(opt);
      }
    };
    fillDays();
    y.addEventListener('change', fillDays);
    m.addEventListener('change', fillDays);
  }

  // ===== WEEKLY BARS =====
  const todayIdx = today.getDay() === 0 ? 6 : today.getDay()-1;
  const weekDayLabels = ['週一','週二','週三','週四','週五','週六','週日'];
  weekDayLabels[todayIdx] = '今天';
  const weekBarColors = ['#7aab8e','#7aab8e','#7aab8e','#e8927a','#78aec8','#a8c9b5','#a8c9b5'];

  function updateWeeklyBars() {
    const container = document.getElementById('weekly-bars');
    if (!container) return;
    container.innerHTML = weekDayLabels.map((label, i) => {
      const pct = weeklyData[i];
      return `<div class="mini-bar-row">
        <span class="name" style="width:36px">${label}</span>
        <div class="mini-bar-track"><div class="mini-bar-fill" style="width:${pct}%;background:${weekBarColors[i]}"></div></div>
        <span class="mini-bar-val">${pct}%</span>
      </div>`;
    }).join('');
    // Update weekly average stat
    const avg = Math.round(weeklyData.filter(v => v > 0).reduce((a, b) => a + b, 0) / Math.max(weeklyData.filter(v => v > 0).length, 1));
    document.getElementById('weekly-pct').textContent = avg;
  }

  // ===== GENERATE PLAN =====
  
function generatePlan() {
    const name = document.getElementById('exam-name').value || '考試';
    const subjects = document.getElementById('subjects-input').value
      .split(',')
      .map(s => s.trim())
      .filter(Boolean);

    const hours = parseInt(document.getElementById('daily-hours').value) || 4;

    if(subjects.length === 0){
      showToast('請先輸入科目');
      return;
    }

    const colors = ['math','english','history','science'];
    let content = '';

    subjects.forEach((subj,index)=>{
      const mins = Math.floor((hours * 60) / subjects.length);

      content += `
      <div class="plan-subject ${colors[index % colors.length]}">
        <div class="plan-subj-header">
          <div class="plan-subj-name">📘 ${subj}</div>
          <div class="plan-time">${mins} 分鐘</div>
        </div>

        <div class="daily-progress-wrap">
          <div class="daily-progress-label">每日完成度</div>
          <div class="daily-progress-bar">
            <div class="daily-progress-fill" style="width:0%"></div>
          </div>
        </div>

        <div class="plan-tasks">
          <div class="plan-task-item" onclick="togglePlanTask(this)">新增 ${subj} 學習任務</div>
        </div>
      </div>`;
    });

    document.getElementById('plan-content').innerHTML = content;

    updateCountdown();
    showToast(`✦ 已生成 ${subjects.length} 科 AI 讀書計畫`);

    document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));

    document.getElementById('panel-plan').classList.add('active');
    document.querySelectorAll('.nav-tab')[2].classList.add('active');

    updateSubjectProgress();
}


  // ===== SAVE SETTINGS =====
  function saveSettings() {
    showToast('設定已儲存 ✓');
    updateCountdown();
  }

  // ===== TOAST =====
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2200);
  }

  
  function jumpToGenerate(){
    document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));

    document.getElementById('panel-setup').classList.add('active');
    document.querySelectorAll('.nav-tab')[3].classList.add('active');

    document.querySelector('.setup-card').scrollIntoView({
      behavior:'smooth'
    });

    showToast('請先設定 AI 讀書計畫');
  }

  function updateSubjectProgress(){
    const subjectInput = document.getElementById('subjects-input').value
      .split(',')
      .map(s=>s.trim())
      .filter(Boolean);

    const container = document.getElementById('subject-bars');

    container.innerHTML = '';

    subjectInput.forEach(subj=>{
      const progress = Math.floor(Math.random()*40);

      container.innerHTML += `
      <div class="mini-bar-row">
        <span class="name">${subj}</span>
        <div class="mini-bar-track">
          <div class="mini-bar-fill" style="width:${progress}%;background:#7aab8e"></div>
        </div>
        <span class="mini-bar-val">${progress}%</span>
      </div>`;
    });
  }

  function analyzeProcrastination(){
    const total = tasks.length;
    const done = tasks.filter(t=>t.done).length;

    const rate = total ? Math.round((done/total)*100) : 0;

    const title = document.getElementById('drag-alert-title');
    const text = document.getElementById('drag-alert-text');

    if(total === 0){
      title.textContent = '尚未建立任務';
      text.textContent = '新增任務後，AI 會分析你的拖延傾向。';
      return;
    }

    if(rate < 30){
      title.textContent = '⚠️ 高拖延風險';
      text.textContent = '你目前完成率偏低，容易延後重要任務。建議先完成短任務建立節奏。';
    }else if(rate < 70){
      title.textContent = '⏳ 中度拖延傾向';
      text.textContent = '部分任務有延遲情況，建議固定每日讀書時段。';
    }else{
      title.textContent = '✅ 狀態良好';
      text.textContent = '目前完成度穩定，拖延風險較低。';
    }
  }


// ===== INIT =====
  initPickerSelects();
  initExamDateSelects();
  initDeadlineSelects();
  renderTasks();
  renderWeekStrip();
  updateWeeklyBars();
  updateDoneCount(); analyzeProcrastination(); updateSubjectProgress();

  document.getElementById('exam-name').addEventListener('input', updateCountdown);
</script>
</body>
</html>
