<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StudyFlow · AI 讀書規劃系統</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Lora:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --sage:#7aab8e; --sage-light:#a8c9b5; --sage-pale:#e8f3ee;
    --parchment:#faf8f4; --text-dark:#2d3a33; --text-mid:#5a6b61;
    --text-light:#8fa598; --accent-coral:#e8927a; --accent-yellow:#f0d080;
    --accent-blue:#78aec8; --border:#d5e8dd; --shadow:rgba(100,150,120,.12);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Noto Sans TC',sans-serif;background:var(--parchment);color:var(--text-dark);min-height:100vh;overflow-x:hidden}
  body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 80% 60% at 10% 20%,rgba(168,201,181,.22) 0%,transparent 60%),radial-gradient(ellipse 60% 50% at 90% 80%,rgba(184,217,232,.18) 0%,transparent 55%),radial-gradient(ellipse 40% 40% at 50% 50%,rgba(240,208,128,.07) 0%,transparent 60%);pointer-events:none;z-index:0}
  .leaf-deco{position:fixed;pointer-events:none;z-index:0;opacity:.06}
  .leaf-deco.tl{top:-40px;left:-40px;width:280px}
  .leaf-deco.br{bottom:-60px;right:-30px;width:320px;transform:rotate(180deg)}
  .app-container{position:relative;z-index:1;max-width:1080px;margin:0 auto;padding:0 20px 60px}

  /* NAV */
  nav{display:flex;align-items:center;justify-content:space-between;padding:28px 0 20px}
  .logo{display:flex;align-items:center;gap:10px}
  .logo-icon{width:36px;height:36px;background:var(--sage);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px}
  .logo-text{font-family:'Lora',serif;font-size:20px;font-weight:600;color:var(--text-dark);letter-spacing:.5px}
  .logo-text span{color:var(--sage)}
  .nav-tabs{display:flex;gap:4px;background:rgba(255,255,255,.7);border:1px solid var(--border);border-radius:14px;padding:5px;backdrop-filter:blur(8px)}
  .nav-tab{padding:8px 18px;border-radius:10px;font-size:13px;font-weight:500;cursor:pointer;transition:all .25s;color:var(--text-mid);border:none;background:transparent;font-family:inherit}
  .nav-tab.active{background:var(--sage);color:white;box-shadow:0 3px 10px rgba(122,171,142,.35)}
  .nav-tab:not(.active):hover{background:var(--sage-pale);color:var(--sage)}
  .panel{display:none;animation:fadeUp .4s ease}
  .panel.active{display:block}
  @keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

  /* HOME */
  .hero-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-top:28px}
  .stat-card{background:rgba(255,255,255,.75);border:1px solid var(--border);border-radius:20px;padding:24px 22px;backdrop-filter:blur(10px);box-shadow:0 4px 20px var(--shadow);transition:transform .2s,box-shadow .2s}
  .stat-card:hover{transform:translateY(-3px);box-shadow:0 8px 28px var(--shadow)}
  .stat-card .label{font-size:12px;color:var(--text-light);letter-spacing:.8px;text-transform:uppercase;margin-bottom:10px}
  .stat-card .value{font-family:'Lora',serif;font-size:36px;font-weight:600;color:var(--text-dark)}
  .stat-card .sub{font-size:13px;color:var(--text-mid);margin-top:6px}
  .stat-card.countdown{background:linear-gradient(135deg,var(--sage) 0%,#5a9070 100%);border-color:transparent}
  .stat-card.countdown .label,.stat-card.countdown .sub{color:rgba(255,255,255,.75)}
  .stat-card.countdown .value{color:white;font-size:48px}
  .exam-type-toggle{display:flex;gap:5px;margin-bottom:8px}
  .exam-type-btn{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;border:1.5px solid rgba(255,255,255,.5);background:transparent;color:rgba(255,255,255,.75);cursor:pointer;font-family:inherit;transition:all .2s}
  .exam-type-btn.active{background:rgba(255,255,255,.25);border-color:white;color:white}
  .countdown-set-btn{display:inline-block;font-size:11px;color:rgba(255,255,255,.7);cursor:pointer;border-bottom:1px dashed rgba(255,255,255,.4);margin-top:4px;background:none;border-top:none;border-left:none;border-right:none;font-family:inherit;padding:0}
  .countdown-set-btn:hover{color:white}
  .section-title{font-family:'Lora',serif;font-size:18px;font-weight:600;color:var(--text-dark);margin:32px 0 14px;display:flex;align-items:center;gap:10px}
  .section-title::after{content:'';flex:1;height:1px;background:linear-gradient(to right,var(--border),transparent)}
  .task-list{display:flex;flex-direction:column;gap:10px}
  .task-item{display:flex;align-items:center;gap:14px;background:rgba(255,255,255,.75);border:1px solid var(--border);border-radius:14px;padding:14px 18px;transition:all .25s;cursor:pointer;backdrop-filter:blur(8px)}
  .task-item:hover{background:rgba(255,255,255,.95);transform:translateX(4px);box-shadow:0 4px 16px var(--shadow)}
  .task-item.done{opacity:.55}
  .task-item.done .task-name{text-decoration:line-through;color:var(--text-light)}
  .task-check{width:22px;height:22px;border-radius:8px;border:2px solid var(--sage-light);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s;background:transparent}
  .task-item.done .task-check{background:var(--sage);border-color:var(--sage)}
  .task-check svg{display:none}
  .task-item.done .task-check svg{display:block}
  .task-name{font-size:14px;font-weight:500}
  .task-sub{font-size:12px;color:var(--text-light);margin-top:2px}
  /* deadline & time badge in task-item */
  .dl-badge{font-size:11px;display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:10px;margin-top:3px}
  .dl-badge.overdue{background:rgba(232,146,122,.15);color:#c0604a}
  .dl-badge.today{background:rgba(232,146,122,.12);color:#c0604a}
  .dl-badge.soon{background:rgba(240,208,128,.2);color:#9a7a20}
  .dl-badge.normal{background:var(--sage-pale);color:var(--text-mid)}
  .tag{padding:4px 10px;border-radius:20px;font-size:11px;font-weight:500;letter-spacing:.3px}
  .tag.high{background:rgba(232,146,122,.15);color:#c0604a}
  .tag.med{background:rgba(240,208,128,.25);color:#9a7a20}
  .tag.low{background:var(--sage-pale);color:var(--sage)}
  .progress-block{margin-top:8px;background:rgba(255,255,255,.75);border:1px solid var(--border);border-radius:20px;padding:22px 24px;backdrop-filter:blur(8px)}
  .progress-label{display:flex;justify-content:space-between;margin-bottom:10px;font-size:13px;color:var(--text-mid)}
  .progress-bar{height:8px;background:var(--sage-pale);border-radius:10px;overflow:hidden}
  .progress-fill{height:100%;background:linear-gradient(to right,var(--sage),var(--accent-blue));border-radius:10px;transition:width .6s ease}
  .subjects-row{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
  .subject-chip{display:flex;align-items:center;gap:7px;padding:6px 13px;border-radius:30px;font-size:12px;font-weight:500;background:rgba(255,255,255,.85);color:var(--text-mid);border:1px solid var(--border);user-select:none}
  .subject-dot{width:10px;height:10px;border-radius:50%;cursor:pointer;border:2px solid transparent;outline:2px solid rgba(0,0,0,.08);transition:transform .15s;flex-shrink:0}
  .subject-dot:hover{transform:scale(1.25)}
  .empty-today{text-align:center;padding:28px 20px;color:var(--text-light);font-size:14px;background:rgba(255,255,255,.5);border:1px dashed var(--border);border-radius:14px}

  /* STRESS ALERT BANNER */
  .stress-banner{background:linear-gradient(135deg,rgba(232,146,122,.18),rgba(240,208,128,.15));border:1.5px solid rgba(232,146,122,.5);border-radius:14px;padding:12px 18px;display:flex;align-items:center;gap:12px;margin-bottom:14px;animation:fadeUp .3s ease}
  .stress-banner .sb-icon{font-size:22px;flex-shrink:0}
  .stress-banner .sb-text{font-size:13px;color:#c0604a;font-weight:500;line-height:1.5}
  .stress-banner .sb-close{margin-left:auto;background:none;border:none;cursor:pointer;color:#c0604a;font-size:16px;opacity:.6;padding:2px 6px;flex-shrink:0}
  .stress-banner .sb-close:hover{opacity:1}

  /* TASKS */
  .procrast-box{border-radius:16px;padding:14px 18px;display:flex;gap:14px;align-items:flex-start;margin-bottom:16px;border:1px solid}
  .procrast-ok{background:linear-gradient(135deg,rgba(122,171,142,.1),rgba(168,201,181,.08));border-color:rgba(122,171,142,.35)}
  .procrast-warn{background:linear-gradient(135deg,rgba(232,146,122,.12),rgba(240,208,128,.1));border-color:rgba(232,146,122,.35)}
  .procrast-icon{font-size:20px;flex-shrink:0;margin-top:2px}
  .procrast-text h4{font-size:14px;font-weight:600;margin-bottom:4px}
  .procrast-ok .procrast-text h4{color:#4a8a62}
  .procrast-warn .procrast-text h4{color:#c0604a}
  .procrast-text p{font-size:13px;color:var(--text-mid);line-height:1.6}
  .add-task-bar{display:flex;gap:8px;margin-top:24px;background:rgba(255,255,255,.8);border:1px solid var(--border);border-radius:16px;padding:12px 14px;backdrop-filter:blur(8px);align-items:center;flex-wrap:wrap}
  .add-task-bar input[type="text"]{flex:1;min-width:100px;border:none;background:transparent;font-family:inherit;font-size:14px;color:var(--text-dark);outline:none}
  .add-task-bar input::placeholder{color:var(--text-light)}
  .add-task-bar select{border:1px solid var(--border);border-radius:8px;padding:5px 8px;font-family:inherit;font-size:12px;color:var(--text-mid);background:white;outline:none}
  .add-task-bar input[type="time"]{border:1px solid var(--border);border-radius:8px;padding:5px 8px;font-family:inherit;font-size:12px;color:var(--text-mid);background:white;outline:none}
  .btn-add{background:var(--sage);color:white;border:none;border-radius:10px;padding:8px 14px;font-family:inherit;font-size:13px;font-weight:500;cursor:pointer;transition:all .2s;white-space:nowrap}
  .btn-add:hover{background:#5a9070;transform:scale(1.02)}
  .task-date-fields{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
  .task-date-label{font-size:11px;color:var(--text-light);white-space:nowrap}
  .filter-row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
  .filter-btn{padding:6px 14px;border-radius:20px;border:1px solid var(--border);background:rgba(255,255,255,.7);font-family:inherit;font-size:12px;color:var(--text-mid);cursor:pointer;transition:all .2s}
  .filter-btn.active{background:var(--sage-pale);color:var(--sage);border-color:var(--sage-light)}
  .task-full{background:rgba(255,255,255,.75);border:1px solid var(--border);border-radius:14px;padding:14px 18px;display:flex;align-items:flex-start;gap:14px;transition:all .25s;backdrop-filter:blur(8px);margin-bottom:10px}
  .task-full:hover{background:rgba(255,255,255,.95);box-shadow:0 4px 16px var(--shadow)}
  .task-full.done{opacity:.5}
  .task-full.done .task-name{text-decoration:line-through}
  .task-full .check-box{width:22px;height:22px;border-radius:8px;border:2px solid var(--sage-light);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s;margin-top:2px}
  .task-full.done .check-box{background:var(--sage);border-color:var(--sage)}
  .task-meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:4px}
  .delete-btn{margin-left:auto;background:none;border:none;cursor:pointer;color:var(--text-light);font-size:16px;opacity:0;transition:opacity .2s;padding:4px;flex-shrink:0}
  .task-full:hover .delete-btn{opacity:1}
  .carryover-badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:600;background:rgba(232,146,122,.15);color:#c0604a;border:1px solid rgba(232,146,122,.3)}

  /* PLAN */
  .date-nav{display:flex;align-items:center;gap:16px;margin-top:24px;margin-bottom:20px;flex-wrap:wrap}
  .date-nav-btn{width:36px;height:36px;border-radius:50%;border:1px solid var(--border);background:rgba(255,255,255,.8);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:all .2s}
  .date-nav-btn:hover{background:var(--sage-pale);border-color:var(--sage-light)}
  .date-display{font-family:'Lora',serif;font-size:22px;font-weight:600;color:var(--text-dark);cursor:pointer;display:flex;align-items:center;gap:8px}
  .date-display span{font-size:14px;font-weight:400;color:var(--text-light)}
  .date-display:hover{color:var(--sage)}
  .date-picker-popup{display:none;position:absolute;z-index:100;background:white;border:1px solid var(--border);border-radius:16px;padding:16px;box-shadow:0 8px 30px rgba(0,0,0,.12);margin-top:8px}
  .date-picker-popup.show{display:block}
  .date-picker-row{display:flex;gap:8px;align-items:center}
  .date-picker-row select{border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-family:inherit;font-size:14px;color:var(--text-dark);background:var(--sage-pale);outline:none;cursor:pointer}
  .btn-confirm-date{background:var(--sage);color:white;border:none;border-radius:8px;padding:8px 16px;font-family:inherit;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap}
  .btn-confirm-date:hover{background:#5a9070}
  .ai-badge{display:inline-flex;align-items:center;gap:5px;background:linear-gradient(135deg,rgba(122,171,142,.15),rgba(120,174,200,.15));border:1px solid var(--sage-light);border-radius:20px;padding:4px 12px;font-size:11px;color:var(--sage);font-weight:600;letter-spacing:.5px;cursor:pointer;transition:background .2s}
  .ai-badge:hover{background:linear-gradient(135deg,rgba(122,171,142,.28),rgba(120,174,200,.25))}
  .week-strip{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-bottom:24px}
  .week-day{background:rgba(255,255,255,.6);border:1px solid var(--border);border-radius:14px;padding:12px 8px;text-align:center;cursor:pointer;transition:all .2s}
  .week-day:hover{background:var(--sage-pale);border-color:var(--sage-light)}
  .week-day.selected{background:var(--sage);border-color:var(--sage)}
  .week-day.selected .wd-day,.week-day.selected .wd-date{color:white}
  .wd-day{font-size:11px;color:var(--text-light);margin-bottom:4px}
  .wd-date{font-size:15px;font-weight:600;color:var(--text-dark)}
  .wd-dot{width:5px;height:5px;border-radius:50%;background:var(--sage-light);margin:5px auto 0}
  .week-day.selected .wd-dot{background:rgba(255,255,255,.6)}
  .week-day.has-tasks .wd-dot{background:var(--accent-coral)}
  .wd-progress{height:3px;background:rgba(255,255,255,.4);border-radius:2px;margin-top:5px;overflow:hidden}
  .wd-progress-fill{height:100%;background:rgba(255,255,255,.8);border-radius:2px;transition:width .5s ease}
  .week-day:not(.selected) .wd-progress{background:var(--sage-pale)}
  .week-day:not(.selected) .wd-progress-fill{background:var(--sage)}
  .plan-subject{background:rgba(255,255,255,.75);border:1px solid var(--border);border-radius:18px;padding:20px 24px;margin-bottom:12px;backdrop-filter:blur(8px);border-left:4px solid var(--sage);transition:all .2s}
  .plan-subject:hover{box-shadow:0 4px 20px var(--shadow);transform:translateX(3px)}
  .plan-subject.from-task{border-left-color:#b88ade}
  .plan-subject.done-record{border-left-color:var(--sage-light);opacity:.8}
  /* plan subject by subject color */
  .plan-subj-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  .plan-subj-name{font-size:15px;font-weight:600}
  .plan-subj-time-slot{font-size:12px;color:var(--text-light);background:var(--sage-pale);border-radius:8px;padding:2px 8px}
  .plan-tasks{display:flex;flex-direction:column;gap:8px}
  .plan-task-item{font-size:13px;color:var(--text-mid);display:flex;gap:8px;align-items:flex-start;cursor:pointer;transition:color .2s;padding:3px 0}
  .plan-task-item::before{content:'›';color:var(--sage);font-size:16px;flex-shrink:0;line-height:1.4}
  .plan-task-item.completed{text-decoration:line-through;opacity:.55}
  .plan-task-item.completed::before{content:'✓';color:var(--sage);font-size:12px}
  .plan-task-dl{font-size:11px;color:var(--text-light);margin-top:2px;display:block}
  .plan-day-progress{background:rgba(255,255,255,.75);border:1px solid var(--border);border-radius:14px;padding:14px 18px;margin-bottom:16px;backdrop-filter:blur(8px)}
  .plan-day-progress-label{display:flex;justify-content:space-between;font-size:12px;color:var(--text-mid);margin-bottom:8px}
  .plan-day-progress-bar{height:7px;background:var(--sage-pale);border-radius:5px;overflow:hidden}
  .plan-day-progress-fill{height:100%;background:linear-gradient(to right,var(--sage),var(--accent-blue));border-radius:5px;transition:width .6s ease}

  /* AI PLAN SCHEDULE CARD — grouped by subject */
  .plan-schedule-group{background:rgba(255,255,255,.75);border:1px solid var(--border);border-radius:18px;padding:18px 22px;margin-bottom:12px;backdrop-filter:blur(8px);transition:all .2s}
  .plan-schedule-group:hover{box-shadow:0 4px 20px var(--shadow);transform:translateX(2px)}
  .psg-header{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .psg-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0}
  .psg-name{font-size:15px;font-weight:600;flex:1}
  .psg-weak-badge{font-size:10px;font-weight:700;background:rgba(232,146,122,.18);color:#c0604a;border:1px solid rgba(232,146,122,.3);border-radius:10px;padding:2px 8px}
  .psg-time{font-size:12px;color:var(--text-light)}
  .psg-tasks{display:flex;flex-direction:column;gap:6px}
  .psg-task-row{display:flex;align-items:flex-start;gap:8px;font-size:13px;color:var(--text-mid);cursor:pointer;padding:3px 0}
  .psg-task-row::before{content:'›';color:var(--sage);font-size:16px;flex-shrink:0;line-height:1.4}
  .psg-task-row.completed{text-decoration:line-through;opacity:.55}
  .psg-task-row.completed::before{content:'✓';color:var(--sage);font-size:12px}
  .psg-task-dl{font-size:11px;color:var(--text-light);margin-left:auto;white-space:nowrap;padding-left:8px}

  /* SETUP */
  .setup-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:24px}
  .setup-card{background:rgba(255,255,255,.75);border:1px solid var(--border);border-radius:20px;padding:24px;backdrop-filter:blur(10px);box-shadow:0 4px 20px var(--shadow)}
  .setup-card h3{font-size:16px;font-weight:600;margin-bottom:16px;display:flex;align-items:center;gap:8px}
  .form-field{margin-bottom:14px}
  .form-field label{display:block;font-size:12px;color:var(--text-light);margin-bottom:5px;letter-spacing:.5px;text-transform:uppercase}
  .form-field input,.form-field select{width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:10px;font-family:inherit;font-size:14px;color:var(--text-dark);background:rgba(255,255,255,.8);outline:none;transition:border-color .2s}
  .form-field input:focus,.form-field select:focus{border-color:var(--sage)}
  .date-selects{display:flex;gap:6px}
  .date-selects select{flex:1;padding:10px 8px;border:1px solid var(--border);border-radius:10px;font-family:inherit;font-size:13px;color:var(--text-dark);background:rgba(255,255,255,.8);outline:none}
  .date-selects select:focus{border-color:var(--sage)}
  /* time range picker */
  .time-range-row{display:flex;gap:8px;align-items:center}
  .time-range-row input[type="time"]{flex:1;padding:9px 10px;border:1px solid var(--border);border-radius:10px;font-family:inherit;font-size:13px;color:var(--text-dark);background:rgba(255,255,255,.8);outline:none}
  .time-range-row input[type="time"]:focus{border-color:var(--sage)}
  .time-range-sep{color:var(--text-light);font-size:13px;white-space:nowrap}
  /* weak subjects tags */
  .weak-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  .weak-tag{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:500;background:rgba(232,146,122,.12);color:#c0604a;border:1px solid rgba(232,146,122,.3);cursor:pointer;transition:all .2s;user-select:none}
  .weak-tag.active{background:rgba(232,146,122,.25);border-color:#c0604a}
  .weak-tag:hover{background:rgba(232,146,122,.2)}
  /* sensitivity row */
  .sens-row{display:flex;gap:8px;align-items:center}
  .sens-row select{flex:1;padding:9px 10px;border:1px solid var(--border);border-radius:10px;font-family:inherit;font-size:13px;color:var(--text-dark);background:rgba(255,255,255,.8);outline:none}
  .sens-row select:focus{border-color:var(--sage)}
  .sens-row input[type="number"]{width:70px;padding:9px 10px;border:1px solid var(--border);border-radius:10px;font-family:inherit;font-size:13px;color:var(--text-dark);background:rgba(255,255,255,.8);outline:none;text-align:center}
  .sens-row input:focus{border-color:var(--sage)}
  .sens-unit{font-size:13px;color:var(--text-light)}
  .btn-generate{width:100%;background:linear-gradient(135deg,var(--sage),#5a9070);color:white;border:none;border-radius:12px;padding:13px;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;transition:all .25s;letter-spacing:.5px;margin-top:4px}
  .btn-generate:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(122,171,142,.4)}
  .generate-feedback{margin-top:12px;padding:10px 14px;border-radius:10px;font-size:13px;display:none}
  .generate-feedback.ok{background:rgba(122,171,142,.12);border:1px solid rgba(122,171,142,.3);color:#3a6a4e;display:block}
  .generate-feedback.err{background:rgba(232,146,122,.1);border:1px solid rgba(232,146,122,.3);color:#c0604a;display:block}
  .analytics-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:20px}
  .analytics-card{background:rgba(255,255,255,.75);border:1px solid var(--border);border-radius:18px;padding:20px;backdrop-filter:blur(8px)}
  .analytics-card h4{font-size:13px;color:var(--text-light);margin-bottom:16px;letter-spacing:.5px;text-transform:uppercase}
  .mini-bars{display:flex;flex-direction:column;gap:8px}
  .mini-bar-row{display:flex;align-items:center;gap:10px;font-size:12px}
  .mini-bar-row .name{width:42px;color:var(--text-mid);flex-shrink:0}
  .mini-bar-track{flex:1;height:6px;background:var(--sage-pale);border-radius:3px;overflow:hidden}
  .mini-bar-fill{height:100%;border-radius:3px;transition:width .8s ease}
  .mini-bar-val{font-size:11px;color:var(--text-light);width:28px;text-align:right}
  .analytics-empty{font-size:13px;color:var(--text-light);padding:6px 0}

  /* COLOR PICKER */
  .color-picker-pop{position:fixed;z-index:500;background:white;border:1px solid var(--border);border-radius:14px;padding:10px;box-shadow:0 8px 28px rgba(0,0,0,.15);display:flex;flex-wrap:wrap;gap:7px;width:168px}
  .cp-swatch{width:24px;height:24px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:transform .12s,border-color .12s}
  .cp-swatch:hover{transform:scale(1.2)}
  .cp-swatch.active{border-color:#333}

  /* TOAST */
  .toast{position:fixed;bottom:28px;right:28px;background:var(--text-dark);color:white;padding:12px 20px;border-radius:12px;font-size:13px;transform:translateY(80px);opacity:0;transition:all .3s;z-index:1000;pointer-events:none;max-width:320px}
  .toast.show{transform:translateY(0);opacity:1}

  /* MODAL */
  .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:200;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
  .modal-overlay.show{display:flex}
  .modal-box{background:white;border-radius:20px;padding:28px;box-shadow:0 20px 60px rgba(0,0,0,.2);min-width:300px}
  .modal-box h3{font-family:'Lora',serif;font-size:18px;margin-bottom:18px;color:var(--text-dark)}
  .modal-selects{display:flex;gap:8px;margin-bottom:18px}
  .modal-selects select{flex:1;padding:10px 8px;border:1px solid var(--border);border-radius:10px;font-family:inherit;font-size:14px;color:var(--text-dark);background:var(--sage-pale);outline:none}
  .modal-btn-row{display:flex;gap:10px;justify-content:flex-end}
  .modal-cancel{background:none;border:1px solid var(--border);border-radius:10px;padding:9px 18px;font-family:inherit;font-size:13px;cursor:pointer;color:var(--text-mid)}
  .modal-confirm{background:var(--sage);color:white;border:none;border-radius:10px;padding:9px 18px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer}
  .modal-confirm:hover{background:#5a9070}

  ::-webkit-scrollbar{width:6px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:var(--sage-light);border-radius:3px}

  @media(max-width:700px){
    .hero-row{grid-template-columns:1fr 1fr}
    .hero-row .stat-card:last-child{grid-column:span 2}
    .setup-grid{grid-template-columns:1fr}
    .analytics-grid{grid-template-columns:1fr}
    .week-strip{gap:4px}
    nav{flex-direction:column;gap:14px}
    .date-selects{flex-wrap:wrap}
  }
</style>
</head>
<body>

<svg class="leaf-deco tl" viewBox="0 0 200 200" fill="none"><path d="M20 180 Q60 20 180 30 Q100 100 20 180Z" fill="#7aab8e"/><path d="M20 180 Q80 80 180 30" stroke="#5a9070" stroke-width="2" fill="none"/></svg>
<svg class="leaf-deco br" viewBox="0 0 200 200" fill="none"><path d="M20 180 Q60 20 180 30 Q100 100 20 180Z" fill="#78aec8"/><path d="M20 180 Q80 80 180 30" stroke="#5a90a8" stroke-width="2" fill="none"/></svg>

<div class="app-container">
  <nav>
    <div class="logo">
      <div class="logo-icon">🌿</div>
      <span class="logo-text">Study<span>Flow</span></span>
    </div>
    <div class="nav-tabs">
      <button class="nav-tab active" onclick="switchTab('home',this)">今日</button>
      <button class="nav-tab" onclick="switchTab('tasks',this)">任務</button>
      <button class="nav-tab" onclick="switchTab('plan',this)">計畫</button>
      <button class="nav-tab" onclick="switchTab('setup',this)">設定</button>
    </div>
  </nav>

  <!-- ===== HOME ===== -->
  <div id="panel-home" class="panel active">
    <!-- Stress banner — injected by JS when task count exceeds threshold -->
    <div id="stress-banner" style="display:none"></div>

    <div class="hero-row">
      <div class="stat-card countdown">
        <div class="exam-type-toggle">
          <button class="exam-type-btn active" onclick="setExamType('midterm',this)">期中考</button>
          <button class="exam-type-btn" onclick="setExamType('final',this)">期末考</button>
        </div>
        <div class="label">距離考試</div>
        <div class="value" id="countdown-val">--</div>
        <div class="sub" id="countdown-sub">請設定考試日期</div>
        <button class="countdown-set-btn" onclick="openCountdownModal()">⚙ 設定日期</button>
      </div>
      <div class="stat-card">
        <div class="label">今日完成</div>
        <div class="value"><span id="done-count">0</span><span style="font-size:18px;color:var(--text-light)" id="total-count">/0</span></div>
        <div class="sub">項任務</div>
      </div>
      <div class="stat-card">
        <div class="label">本週完成率</div>
        <div class="value" style="color:var(--sage)"><span id="weekly-pct">0</span><span style="font-size:18px">%</span></div>
        <div class="sub" id="weekly-sub">尚未開始</div>
      </div>
    </div>

    <div class="section-title">📋 今日任務</div>
    <div class="task-list" id="home-tasks">
      <div class="empty-today">🌿 今天沒有任務，去「任務」區新增吧！</div>
    </div>

    <div class="section-title">📊 各科進度</div>
    <div class="progress-block">
      <div class="progress-label"><span>整體學習進度</span><span id="prog-pct">0%</span></div>
      <div class="progress-bar"><div class="progress-fill" id="prog-fill" style="width:0%"></div></div>
      <div class="subjects-row" id="subjects-row"></div>
    </div>
  </div>

  <!-- ===== TASKS ===== -->
  <div id="panel-tasks" class="panel">
    <div id="procrast-box" style="display:none"></div>

    <div class="add-task-bar">
      <span style="font-size:18px">✏️</span>
      <input type="text" id="task-input" placeholder="新增任務...按 Enter 送出"
             onkeydown="if(event.key==='Enter')addTaskBtn()"
             oninput="onTaskInputChange()">
      <select id="task-type">
        <option>讀書</option><option>考試</option><option>作業</option>
        <option>生活</option><option>比賽</option>
      </select>
      <select id="task-priority">
        <option value="high">重要</option>
        <option value="med" selected>一般</option>
        <option value="low">輕鬆</option>
      </select>
      <div style="display:flex;align-items:center;gap:4px;flex-shrink:0;flex-wrap:wrap">
        <span class="task-date-label">截止：</span>
        <div class="task-date-fields">
          <select id="deadline-year"></select>
          <select id="deadline-month"></select>
          <select id="deadline-day"></select>
          <input type="time" id="deadline-time" title="截止時間（選填）" style="width:88px">
        </div>
      </div>
      <button class="btn-add" onclick="addTaskBtn()">＋ 新增</button>
    </div>

    <div class="filter-row">
      <button class="filter-btn active" onclick="filterTasks(this,'all')">全部</button>
      <button class="filter-btn" onclick="filterTasks(this,'active')">未完成</button>
      <button class="filter-btn" onclick="filterTasks(this,'done')">已完成</button>
      <button class="filter-btn" onclick="filterTasks(this,'high')">⚡ 重要</button>
      <button class="filter-btn" onclick="filterTasks(this,'exam')">📝 考試</button>
      <button class="filter-btn" onclick="filterTasks(this,'contest')">🏆 比賽</button>
    </div>

    <div class="task-list" id="full-task-list" style="margin-top:16px"></div>
  </div>

  <!-- ===== PLAN ===== -->
  <div id="panel-plan" class="panel">
    <div class="date-nav" style="position:relative">
      <button class="date-nav-btn" onclick="changeDate(-1)">‹</button>
      <div style="position:relative">
        <div class="date-display" id="plan-date-display" onclick="toggleDatePicker()" title="點擊選擇日期">
          載入中 <span style="font-size:14px;color:var(--sage)">▾</span>
        </div>
        <div class="date-picker-popup" id="date-picker-popup">
          <div class="date-picker-row">
            <select id="pick-year"></select>
            <span style="color:var(--text-light);font-size:13px">年</span>
            <select id="pick-month"></select>
            <span style="color:var(--text-light);font-size:13px">月</span>
            <select id="pick-day"></select>
            <span style="color:var(--text-light);font-size:13px">日</span>
            <button class="btn-confirm-date" onclick="confirmDatePicker()">確認</button>
          </div>
        </div>
      </div>
      <button class="date-nav-btn" onclick="changeDate(1)">›</button>
      <div style="margin-left:auto">
        <span class="ai-badge" onclick="goToExamSetup()">✦ AI 自動排程</span>
      </div>
    </div>

    <div class="week-strip" id="week-strip"></div>

    <div class="plan-day-progress">
      <div class="plan-day-progress-label">
        <span>當日任務進度</span>
        <span id="plan-day-pct">0%</span>
      </div>
      <div class="plan-day-progress-bar">
        <div class="plan-day-progress-fill" id="plan-day-fill" style="width:0%"></div>
      </div>
    </div>

    <div id="plan-content"></div>
  </div>

  <!-- ===== SETUP ===== -->
  <div id="panel-setup" class="panel">
    <div class="setup-grid">
      
      <!-- Wrong Answer AI System -->
      <div class="setup-card" id="wrong-answer-card">
        <h3>📸 錯題本與魔王關卡生成 <span class="ai-badge" style="cursor:default">✦ AI</span></h3>

        <div class="form-field">
          <label>目前科目（逗號分隔）</label>
          <input type="text" placeholder="數學, 英文, 歷史" id="subjects-input" oninput="updateSubjectDatabase()">
        </div>

        <div class="form-field">
          <label>錯題相機</label>
          <input type="file" id="wrong-question-camera" accept="image/*">
        </div>

        <div class="form-field">
          <label>錯題內容描述</label>
          <input type="text" id="wrong-question-text" placeholder="例如：英文文法錯誤、數學函數不會">
        </div>

        <button class="btn-generate" onclick="analyzeWrongQuestion()">✦ AI 分析錯題並加入複習計畫</button>

        <div class="generate-feedback" id="wrong-feedback"></div>

        <div id="wrong-question-records" style="margin-top:18px">
          <div style="font-size:12px;color:var(--text-light)">尚未建立錯題紀錄</div>
        </div>
      </div>

      <!-- Reminder settings card -->

      <div class="setup-card">
        <h3>🔔 提醒設定</h3>
        <div class="form-field">
          <label>每日提醒時間</label>
          <input type="time" value="08:30" id="reminder-time">
        </div>
        <div class="form-field">
          <label>拖延偵測靈敏度</label>
          <div class="sens-row">
            <select id="procrastination-sensitivity">
              <option value="days">天</option>
              <option value="hours">小時</option>
              <option value="minutes">分鐘</option>
            </select>
            <input type="number" id="sens-value" min="1" max="999" value="2">
            <span class="sens-unit" id="sens-unit-label">天以上視為拖延</span>
          </div>
        </div>
        <div class="form-field">
          <label>壓力過高警示（未完成任務數超過）</label>
          <input type="number" min="1" max="50" value="8" id="stress-threshold" oninput="checkStressNow()">
        </div>
        <button class="btn-generate" style="background:linear-gradient(135deg,var(--accent-blue),#5a8aab)" onclick="saveSettings()">💾 儲存設定</button>
        <div class="generate-feedback" id="save-feedback"></div>
      </div>
    </div>

    
    <div class="section-title">📝 作業紀錄區</div>
    <div class="setup-card" style="margin-top:12px">
      <h3>📚 自動偵測作業紀錄</h3>

      <div class="add-task-bar" style="margin-top:0">
        <input type="text" id="assignment-detect-input"
          placeholder="例如：資訊老師說明天前繳交作業">
        <button class="btn-add" onclick="detectAssignment()">偵測作業</button>
      </div>

      <div id="assignment-records" style="margin-top:16px;color:var(--text-mid);font-size:13px">
        尚未偵測到作業
      </div>
    </div>

<div class="section-title">📈 學習效率分析</div>
    <div class="analytics-grid">
      <div class="analytics-card">
        <h4>各科任務進度</h4>
        <div class="mini-bars" id="subject-bars">
          <div class="analytics-empty">新增任務後將自動顯示各科統計</div>
        </div>
      </div>
      <div class="analytics-card">
        <h4>本週完成率</h4>
        <div class="mini-bars" id="weekly-bars"></div>
      </div>
    </div>
  </div>
</div>

<!-- Countdown modal -->
<div class="modal-overlay" id="countdown-modal">
  <div class="modal-box">
    <h3 id="modal-title">設定考試日期</h3>
    <div class="modal-selects">
      <select id="modal-year"></select>
      <select id="modal-month"></select>
      <select id="modal-day"></select>
    </div>
    <div class="modal-btn-row">
      <button class="modal-cancel" onclick="closeCountdownModal()">取消</button>
      <button class="modal-confirm" onclick="confirmCountdownModal()">確認</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>


<script>
let assignmentRecords = [];
let wrongQuestionRecords = [];
let subjectDatabase = [];

function updateSubjectDatabase(){
  const input = document.getElementById('subjects-input');
  if(!input) return;

  subjectDatabase = input.value
    .split(',')
    .map(s=>s.trim())
    .filter(Boolean);
}

function detectAssignment(){
  const input = document.getElementById('assignment-detect-input');
  const text = input.value.trim();

  if(!text) return;

  const assignmentKeywords = ['作業','報告','繳交','作文','講義','習題'];
  const hasKeyword = assignmentKeywords.some(k=>text.includes(k));

  let detectedSubject = null;

  subjectDatabase.forEach(sub=>{
    if(text.includes(sub)){
      detectedSubject = sub;
    }
  });

  if(!detectedSubject || !hasKeyword){
    showToast('未偵測到有效作業');
    return;
  }

  assignmentRecords.unshift({
    subject: detectedSubject,
    content: text,
    time: new Date().toLocaleString('zh-TW')
  });

  tasks.unshift({
    id: Date.now(),
    name: detectedSubject + ' 作業：' + text,
    type: detectedSubject,
    priority:'high',
    done:false,
    deadline: todayStr,
    deadlineTime:null,
    effectiveDate: todayStr,
    carriedFrom:null
  });

  renderAssignmentRecords();
  syncAll();

  showToast('剛才偵測到 ' + detectedSubject + ' 發布新作業！');

  input.value='';
}

function renderAssignmentRecords(){
  const box = document.getElementById('assignment-records');

  if(assignmentRecords.length===0){
    box.innerHTML='尚未偵測到作業';
    return;
  }

  box.innerHTML = assignmentRecords.map(r=>`
    <div style="padding:12px;margin-bottom:10px;border-radius:12px;background:rgba(255,255,255,.75);border:1px solid var(--border)">
      <div style="font-weight:600">${r.subject} 作業</div>
      <div style="font-size:13px;margin-top:4px">${r.content}</div>
      <div style="font-size:11px;color:var(--text-light);margin-top:6px">${r.time}</div>
    </div>
  `).join('');
}

function analyzeWrongQuestion(){
  const text = document.getElementById('wrong-question-text').value.trim();
  const feedback = document.getElementById('wrong-feedback');

  if(!text){
    feedback.className='generate-feedback err';
    feedback.textContent='請輸入錯題內容';
    return;
  }

  let detectedSubject = '未分類';
  let detectedUnit = '基礎觀念';
  let detectedConcept = '需要加強';

  if(text.includes('函數') || text.includes('方程式')){
    detectedSubject='數學';
    detectedUnit='函數與方程式';
    detectedConcept='函數運算';
  }
  else if(text.includes('文法') || text.includes('單字')){
    detectedSubject='英文';
    detectedUnit='英文文法';
    detectedConcept='時態與句型';
  }
  else if(text.includes('年代') || text.includes('戰爭')){
    detectedSubject='歷史';
    detectedUnit='歷史事件';
    detectedConcept='年代判斷';
  }

  const tomorrow = new Date();
  tomorrow.setDate(tomorrow.getDate()+1);

  tasks.unshift({
    id: Date.now() + Math.random(),
    name: '錯題複習：' + detectedUnit,
    type: detectedSubject,
    priority:'high',
    done:false,
    deadline: fmtD(tomorrow),
    deadlineTime:'20:00',
    effectiveDate: fmtD(tomorrow),
    carriedFrom:null
  });

  wrongQuestionRecords.unshift({
    subject: detectedSubject,
    unit: detectedUnit,
    concept: detectedConcept,
    text:text,
    time:new Date().toLocaleString('zh-TW')
  });

  renderWrongQuestionRecords();
  syncAll();

  feedback.className='generate-feedback ok';
  feedback.textContent='AI 已分析：' + detectedSubject + '｜' + detectedUnit + '｜' + detectedConcept + '，並自動加入明天讀書計畫。';

  document.getElementById('wrong-question-text').value='';

  showToast('已新增錯題複習計畫！');
}

function renderWrongQuestionRecords(){
  const box = document.getElementById('wrong-question-records');

  if(wrongQuestionRecords.length===0){
    box.innerHTML='<div style="font-size:12px;color:var(--text-light)">尚未建立錯題紀錄</div>';
    return;
  }

  box.innerHTML = wrongQuestionRecords.map(r=>`
    <div style="padding:14px;margin-bottom:12px;border-radius:14px;background:rgba(255,255,255,.75);border:1px solid var(--border)">
      <div style="font-weight:700">${r.subject}｜${r.unit}</div>
      <div style="font-size:13px;margin-top:6px">錯誤觀念：${r.concept}</div>
      <div style="font-size:13px;margin-top:4px">${r.text}</div>
      <div style="font-size:11px;color:var(--text-light);margin-top:8px">${r.time}</div>
    </div>
  `).join('');
}
</script>

</body>
</html>
